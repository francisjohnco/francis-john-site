document.addEventListener('submit', e => {
  const form = e.target.closest('#contactForm');
  if (!form) return;
  e.preventDefault();

  const status = document.getElementById('cfStatus');
  const btn = document.getElementById('cfSend');
  const fail = (msg, bad) => {
    status.textContent = '';
    status.innerHTML = msg;
    status.classList.toggle('bad', !!bad);
  };

  /* validate */
  let firstBad = null;
  const rules = {
    name:  v => v.trim().length >= 2 || 'Enter your name.',
    email: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) || 'Enter an email address I can reply to.',
    message: v => v.trim().length >= 10 || 'A sentence or two about what you need.'
  };
  Object.keys(rules).forEach(k => {
    const input = form.querySelector('[name="'+k+'"]');
    const wrap = input.closest('.field');
    const res = rules[k](input.value);
    const ok = res === true;
    wrap.classList.toggle('bad', !ok);
    wrap.querySelector('.err').textContent = ok ? '' : res;
    if (!ok && !firstBad) firstBad = input;
  });
  if (firstBad){
    firstBad.focus();
    fail('Three fields need fixing before this can send.', true);
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  fail('');

  const body = new URLSearchParams(new FormData(form)).toString();
  fetch('/', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body })
    .then(r => {
      if (!r.ok) throw new Error('status ' + r.status);
      form.outerHTML = '<div class="cform-done">'
        + '<span class="eyebrow">Sent</span>'
        + '<h3 style="margin-top:12px">'+esc(Store.data.copy.contactPage.doneTitle)+'</h3>'
        + '<p>'+esc(Store.data.copy.contactPage.doneBody)+' If it is urgent, call '
        + esc(Store.data.profile.phone) + '.</p>'
        + '<a class="btn btn-ghost" href="/systems" data-link>Look at the systems while you wait</a></div>';
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = Store.data.copy.contactPage.sendBtn;
      const email = Store.data.profile.email;
      fail('This form delivers once the site is live on Netlify — it cannot send from a local file or a preview. '
        + 'Email <a href="mailto:'+attr(email)+'">'+esc(email)+'</a> in the meantime.', true);
    });
});

  const skills = d.clusters.map(cl =>

    + '<div class="gt">' + esc(cl.title) + ' — ' + esc(cl.note) + '</div>'
    + '<ul class="pr-list">' + (cl.items||[]).map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>'
    + '</div>').join('');

  const education = d.education.map(e =>
    '<div class="pr-edu"><div class="ec">' + esc(e.credential) + '</div>'
    + '<div class="es">' + esc(e.school) + '</div>'
    + '<div class="ed">' + esc(e.when) + '</div></div>').join('');

  const roles = d.experience.map(x =>
    '<div class="pr-role"><div class="rt">' + esc(x.role) + '</div>'
    + '<div class="ro"><span>' + esc(x.org) + '</span><span class="rd">' + esc(x.when) + '</span></div>'
    + '<ul>' + (x.bullets||[]).map(b => '<li>' + esc(b) + '</li>').join('') + '</ul></div>').join('');

  const systems = d.projects.map(pr =>
    '<div class="pr-sys"><div class="st">' + esc(pr.title) + (pr.year ? ' <span class="rd">· ' + esc(pr.year) + '</span>' : '') + '</div>'
    + '<div class="sd">' + esc(pr.summary) + '</div></div>').join('');

  /* the profile statement, flattened out of markdown into plain paragraphs */
  const summary = String(p.summary||'').split(/\n{2,}/)
    .map(t => '<p>' + esc(t.replace(/[#*_>`]/g,'').trim()) + '</p>').join('');

  return '<div class="pr-head">'
      + '<div><div class="nm">' + esc(p.firstName) + ' <b>' + esc(p.lastName) + '</b></div>'
      + '<div class="rl">' + esc(p.role) + '</div>'
      + (p.availability ? '<div class="av">' + esc(p.availability) + '</div>' : '')
      + '</div>'
      + (p.photo ? '<img class="pr-photo" src="' + attr(p.photo) + '" alt="">' : '')
    + '</div>'
    + '<div class="pr-contact"><span>' + esc(p.phone) + '</span><span>' + esc(p.email) + '</span>'
      + '<span>' + esc(p.location) + '</span><span>' + esc(p.website) + '</span>'
      + (p.networkUrl ? '<span>' + esc(p.networkUrl.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'')) + '</span>' : '')
      + '</div>'
    + '<div class="pr-cols">'
      + '<div class="pr-l">'
        + '<div class="pr-sec"><h2 class="pr-h">Skills</h2>' + skills + '</div>'
        + '<div class="pr-sec"><h2 class="pr-h">Education</h2>' + education + '</div>'
      + '</div>'
      + '<div class="pr-r">'
        + '<div class="pr-sec"><h2 class="pr-h">Profile</h2>' + summary + '</div>'
        + '<div class="pr-sec"><h2 class="pr-h">Experience</h2>' + roles + '</div>'
        + (systems ? '<div class="pr-sec"><h2 class="pr-h">Systems built</h2>' + systems + '</div>' : '')
      + '</div>'
    + '</div>'
    + '<div class="pr-foot"><span>' + esc(p.name) + ' · ' + esc(p.role) + '</span>'
      + '<span>' + esc(d.meta.domain.replace(/^https?:\/\//,'')) + '</span></div>';
}

/* ============================================================
   8. File generators
   ============================================================ */
function buildPublishHtml(){
  const d = Store.data, m = d.meta;
  /* Downloading this file and deploying it bakes current content into the HTML,
     so every published post is now baked. Mark them, so the dashboard reminder
     clears on next load. */
  (d.posts||[]).forEach(p => { if (p.status === 'published') p.baked = true; });
  const json = JSON.stringify(d, null, 2).replace(/</g, '\\u003c');
  let html = PRISTINE.replace(
    /(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/,
    () => '<script type="application/json" id="seed">\n' + json + '\n</' + 'script>'
  );
  html = html.replace(/<title>[\s\S]*?<\/title>/, '<title>' + esc(m.defaultTitle) + '</title>');
  html = html.replace(/<meta name="description" content="[^"]*">/, '<meta name="description" content="' + attr(m.defaultDescription) + '">');
  html = html.replace(/<link rel="canonical" href="[^"]*">/, '<link rel="canonical" href="' + attr((m.domain||'').replace(/\/$/,'') + '/') + '">');
  if (m.gaId){
    const ga = '<script async src="https://www.googletagmanager.com/gtag/js?id=' + m.gaId + '"></' + 'script>\n'
      + '<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","' + m.gaId + '");</' + 'script>\n';
    html = html.replace('</head>', ga + '</head>');
  }
  return html;
}
function sitemapXml(){
  const d = Store.data, base = (d.meta.domain||'').replace(/\/$/,'');
  const today = new Date().toISOString().slice(0,10);
  const urls = [
    { loc:'/', pri:'1.0', mod:today },
    { loc:'/systems', pri:'0.8', mod:today },
    { loc:'/services', pri:'0.9', mod:today },
    { loc:'/journal', pri:'0.8', mod:today },
    { loc:'/contact', pri:'0.6', mod:today }
  ]
  .concat(d.projects.filter(p=>!(p.seo&&p.seo.noindex)).map(p=>({ loc:'/systems/'+p.slug, pri:'0.7', mod:today })))
  .concat(d.posts.filter(p=>p.status==='published'&&!(p.seo&&p.seo.noindex)).map(p=>({ loc:'/journal/'+p.slug, pri:'0.7', mod:p.date||today })));
  return '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
    + urls.map(u=>'  <url>\n    <loc>'+base+u.loc+'</loc>\n    <lastmod>'+u.mod+'</lastmod>\n    <priority>'+u.pri+'</priority>\n  </url>').join('\n')
    + '\n</urlset>\n';
}

/* ============================================================
   9. Render
   ============================================================ */
function render(){
  const path = currentPath();
  const seg = path.split('/').filter(Boolean);
  const main = document.getElementById('main');
  render._path = path;
  let html;

  if (seg[0] === 'work'){ navigate('/systems' + (seg[1] ? '/'+seg[1] : ''), true); return; }
  if (seg[0] === 'admin') html = Admin.view();
  else if (seg[0] === 'systems') html = seg[1] ? V.project(seg[1]) : V.work();
  else if (seg[0] === 'services') html = V.services();
  else if (seg[0] === 'marketplace') html = V.marketplace();
  else if (seg[0] === 'resume') html = V.home();
  else if (seg[0] === 'journal') html = seg[1] ? V.post(seg[1]) : V.journal();
  else if (seg[0] === 'contact') html = V.contact();
  else if (seg.length === 0) html = V.homepage();
  else html = V.missing();

  main.innerHTML = html;
  if (seg.length === 0 && typeof initHomepage === 'function') initHomepage();
  document.getElementById('siteFooter').innerHTML = footerHtml();
  document.getElementById('topbar').style.display = seg[0] === 'admin' ? 'none' : '';
  document.querySelectorAll('#nav a[data-link]').forEach(a=>{
    const h = a.getAttribute('href');
    const on = h === '/' ? path === '/' : path.indexOf(h) === 0;
    if (on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  Admin.paintStatus();
  observe();
  onScroll();
  if (!render._first) window.scrollTo(0,0);
  render._first = false;
}

  const d = Store.data, y = new Date().getFullYear();

    + '<span class="small">© '+y+' '+esc(d.profile.name)+'. '+esc(d.meta.footerNote)+'</span>'

      + '<a href="/journal" data-link>Journal</a><a href="/resume" data-link>Résumé</a><a href="/contact" data-link>Contact</a>'
      + '<a href="mailto:'+attr(d.profile.email)+'">Email</a>'
      + '<a href="/admin" data-link>Dashboard</a>'
    + '</span></div>';
}

/* reveal on scroll, staggered by position, plus counting figures */
let io;
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function countUp(el){
  if (el.dataset.counted) return;
  el.dataset.counted = '1';
  const target = el.getAttribute('data-to') || el.textContent;
  const num = parseFloat(String(target).replace(/[^0-9.]/g,''));
  if (!isFinite(num) || reduced){ el.textContent = target; return; }
  const dur = 900, t0 = performance.now();
  const isYear = num > 1900 && num < 2100;
  const from = isYear ? num - 12 : 0;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    const val = Math.round(from + (num - from) * eased);
    el.textContent = String(target).replace(/[0-9.]+/, val);
    if (k < 1) requestAnimationFrame(step);
    else el.textContent = target;
  };
  requestAnimationFrame(step);
}

function observe(){
  if (io) io.disconnect();
  const targets = document.querySelectorAll('.rv,.sec');

  /* stagger siblings so groups arrive in sequence rather than all at once */
  targets.forEach(el => {
    if (!el.classList.contains('rv')) return;
    const sibs = el.parentElement ? [...el.parentElement.children].filter(n => n.classList.contains('rv')) : [];
    const i = Math.max(0, sibs.indexOf(el));
    el.style.transitionDelay = Math.min(i * 70, 350) + 'ms';
  });

  if (!('IntersectionObserver' in window)){
    targets.forEach(el => el.classList.add('in'));
    document.querySelectorAll('.count').forEach(el => el.textContent = el.getAttribute('data-to'));
    return;
  }
  io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add('in');
      en.target.querySelectorAll && en.target.querySelectorAll('.count').forEach(countUp);
      io.unobserve(en.target);
    });
  }, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
  targets.forEach(el => io.observe(el));
}

/* the spine draws itself as the page moves */
let spineRaf = null;
function drawSpine(){
  spineRaf = null;
  const fill = document.getElementById('spineFill');
  if (!fill) return;
  const spine = fill.parentElement;
  const box = spine.getBoundingClientRect();
  const mark = window.innerHeight * 0.55;
  const h = Math.max(0, Math.min(box.height, mark - box.top));
  fill.style.height = h + 'px';
  fill.style.backgroundSize = '1px ' + box.height + 'px';
}
function onScroll(){
  if (spineRaf === null) spineRaf = requestAnimationFrame(drawSpine);
}
window.addEventListener('scroll', onScroll, { passive:true });
window.addEventListener('resize', onScroll);

/* The server holds the copy every device shares. Local storage is only a
   cache, so the two are reconciled once at boot. */
async function syncFromServer(){
  const remote = await Remote.pull();
  if (!remote){ Admin.paintStatus(); return; }

  const seedV   = (SEED.meta && SEED.meta.contentVersion) || 0;
  const remoteV = (remote.meta && remote.meta.contentVersion) || 0;

  if (seedV > remoteV){
    /* A newer file has been deployed. Rather than letting the file overwrite
       what is live, merge them: the live server is the source of truth for
       content you have edited (which posts are published, your text), and the
       file only contributes things that are genuinely new (posts you have never
       seen, structural additions like new pages or fields).
       Nothing live gets reverted; nothing new gets lost. */
    const merged = reconcile(clone(SEED), remote);
    /* keep a rollback copy of exactly what the server had, just in case */
    try { localStorage.setItem(KEY + '.prev', JSON.stringify(remote)); } catch(e){ Store.prevMemory = JSON.stringify(remote); }
    Store.data = merged;
    Store.migrated = true;
    try { localStorage.setItem(KEY, JSON.stringify(merged)); } catch(e){}
    /* push the reconciled result back so every device — and the server — agree */
    if (Remote.key){ Remote.push(merged).then(()=> Admin.paintStatus()); }
    render();
    return;
  }

  const localT  = Store.data._savedAt || 0;
  const remoteT = remote._savedAt || 0;
  if (remoteT >= localT){
    Store.data = merge(clone(SEED), remote);
    Store.dirty = false;
    try { localStorage.setItem(KEY, JSON.stringify(Store.data)); } catch(e){}
    render();
  } else if (Remote.key){
    /* this browser holds newer work than the server; put it back */
    Remote.push(Store.data).then(()=> Admin.paintStatus());
  }
  Admin.paintStatus();
}

/* Merge a freshly deployed file (seed) with the live server content so that:
   - live content wins for anything that already exists (published state, edits)
   - the file only ADDS things the server has never seen (new posts, new pages)
   Posts are matched by slug; the live version of an existing post is kept
   verbatim, and only brand-new posts from the file are appended. */
function reconcile(seed, remote){
  const out = merge(clone(seed), remote);   // start from live content as the base of truth

  // --- posts: keep every live post, but fill any BLANK field from the file ---
  // Live content is the source of truth for anything you have set. But if the
  // file adds something the live post is simply missing (a cover image, an
  // external link, a CTA), fill it in — an addition is not an override.
  const livePosts = Array.isArray(remote.posts) ? remote.posts : [];
  const liveSlugs = new Set(livePosts.map(p => p.slug));
  const seedPosts = Array.isArray(seed.posts) ? seed.posts : [];
  const seedBySlug = {};
  seedPosts.forEach(p => { seedBySlug[p.slug] = p; });
  const isBlank = v => v == null || v === '' || (Array.isArray(v) && v.length === 0);
  const seedNewer = ((seed.meta&&seed.meta.contentVersion)||0) > ((remote.meta&&remote.meta.contentVersion)||0);
  const mergedLive = livePosts.map(lp => {
    const fp = seedBySlug[lp.slug];
    if (!fp) return lp;
    const merged = Object.assign({}, lp);
    // back-fill blank additive fields from the file
    ['cover','excerpt','externalUrl','externalLabel','projectSlug','cta','publishAt'].forEach(k => {
      if (isBlank(merged[k]) && !isBlank(fp[k])) merged[k] = fp[k];
    });
    // publishing is a deliberate act in the file: if a newer deploy marks a post
    // published, honor it — a server draft should not keep it hidden. (We never
    // go the other way: the file can't un-publish something you published live.)
    if (seedNewer && fp.status === 'published' && merged.status !== 'published'){
      merged.status = 'published';
      if (isBlank(merged.date) && !isBlank(fp.date)) merged.date = fp.date;
      merged.baked = true;
      delete merged.publishAt;
    }
    return merged;
  });
  const brandNew = seedPosts.filter(p => !liveSlugs.has(p.slug));
  out.posts = mergedLive.concat(brandNew);   // live (back-filled) first, new after

  // --- projects (systems): same rule, matched by slug ---
  if (Array.isArray(seed.projects)){
    const liveProj = Array.isArray(remote.projects) ? remote.projects : [];
    const liveProjSlugs = new Set(liveProj.map(p => p.slug));
    out.projects = liveProj.concat(seed.projects.filter(p => !liveProjSlugs.has(p.slug)));
  }

  // --- structural additions from the file that the server may not have yet ---
  // (new pages/blocks like services or industries — take from file if absent live)
  ['services','industries'].forEach(k => {
    if (seed[k] && !remote[k]) out[k] = seed[k];
  });

  // --- profile prose: when the deployed FILE is newer, its wording wins ---
  // Hero pitch, summary, role and availability are authored in the file (by
  // deliberate edits), not tweaked live day-to-day like post status. If the
  // file's version is newer, its copy should replace a stale stored version —
  // otherwise an old browser/server copy silently keeps the old hero.
  const seedV = (seed.meta && seed.meta.contentVersion) || 0;
  const remoteV = (remote.meta && remote.meta.contentVersion) || 0;
  if (seedV > remoteV && seed.profile){
    out.profile = out.profile || {};
    ['pitch','summary','role','availability','company'].forEach(k => {
      if (seed.profile[k] != null) out.profile[k] = seed.profile[k];
    });
  }

  // stamp with the higher version so the merged result is treated as current
  out.meta = out.meta || {};
  out.meta.contentVersion = Math.max(
    (seed.meta && seed.meta.contentVersion) || 0,
    (remote.meta && remote.meta.contentVersion) || 0
  );
  out._savedAt = Date.now();
  return out;
}
