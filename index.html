      "body": "Most local businesses fight for a small radius against many competitors. Upper cervical chiropractic is the opposite situation — and that makes it one of the most winnable niches in local search. Here's why, and how to take advantage of it. This ties into my [complete guide to local SEO for upper cervical chiropractic](/journal/local-seo-for-upper-cervical-chiropractic).\n\n## Three things line up in your favor\n\n**High intent.** The patients searching for upper cervical have usually tried everything else and found the specialty on purpose. They're informed, motivated, and ready to book — the behavior I detail in [how patients find an upper cervical chiropractor](/journal/how-do-patients-find-an-upper-cervical-chiropractor).\n\n**Willingness to travel.** Because they've decided what they want, distance rarely stops them. Your market isn't your neighborhood — it's the whole region within driving range.\n\n**Thin competition.** Far fewer practices optimize for \"NUCCA\" or \"Blair technique\" than for \"chiropractor,\" because far fewer are that. You're competing for a high-value search against a short list.\n\n## What that combination means\n\nHigh intent, a wide travel radius, and few competitors is close to an ideal local SEO situation. The patients are motivated and already looking; the searches are specific; the field is thin. The only thing standing between you and those patients is visibility — being the practice that appears when they search the technique.\n\n## How to take the advantage\n\nName your technique everywhere, claim a wide service area, gather specific reviews, and build the off-page authority that lifts your rankings. That last piece is often the fastest — you can plug into authority that already exists rather than build it from scratch, the idea behind [why you don't start from zero](/journal/you-dont-start-from-scratch-the-marketplaces-i-built). For the clinical framework patients reference, the [International Chiropractors Assoc     {
      "slug": "which-revenue-engine-is-leaking-four-cylinders-diagnostic",
      "title": "Which of your four revenue engines is leaking? A local business diagnostic",
      "date": "2026-08-23",
      "status": "published",
      "author": "Francis John",
      "baked": true,
      "excerpt": "Most local businesses lose revenue in one specific place — one cylinder of the engine that isn't firing. Here's how to tell which of the four (visibility, authority, reputation, retention) is leaking yours, and the three-step process to get it back.",
      "tags": [
        "Local SEO",
        "Authority",
        "Reputation"
      ],
      "relatedSlugs": [
        "how-to-build-local-authority-faster",
        "why-more-reviews-wins-even-when-youre-better",
        "the-customer-you-already-paid-for",
        "you-dont-start-from-scratch-the-marketplaces-i-built"
      ],
      "body": "Every local business runs on the same four-cylinder engine: **visibility, authority, reputation, retention.** Get found, look like the expert, get chosen, keep them. When all four fire, revenue compounds. When one stops, you leak customers — usually without knowing where the leak is.\n\nThe frustrating part is that the symptoms all *feel* the same (\"we're not getting enough business\"), but the cause is almost always one specific cylinder. Fix the wrong one and nothing changes. So before you spend a dollar, you need to know which cylinder is dead. Here's how to tell.\n\n## Cylinder 1 — Visibility: are you even getting found?\n\n**What it does:** you show up when customers search — the map pack, local SEO, and the AI tools people now ask instead of Google.\n\n**Signs this is your leak:**\n- You rank far down (or nowhere) when you search your own service plus your town.\n- Competitors you know are worse show up above you.\n- Almost nobody says \"I found you on Google.\"\n\nIf this is the dead cylinder, no amount of reviews or follow-up matters — people can't choose a business they never see. This is the most common leak, and often the one hiding your other cylinders from ever getting a chance.\n\n## Cylinder 2 — Authority: do you look like the obvious choice?\n\n**What it does:** the signals that make you the credible, expert option before the first call.\n\n**Signs this is your leak:**\n- People find you but bounce to a competitor who \"seems more established.\"\n- You're invisible in AI recommendations even when you rank on Google.\n- You have no presence on the trusted, relevant sites in your industry.\n\nAuthority is the one you can't declare yourself — it's conferred by others. If this is your leak, the fix is off-page: relevant citations and mentions. I break down the whole mechanism in [how I build authority faster](/journal/how-to-build-local-authority-faster), and it's exactly what my [marketplaces](/marketplace) are built to deliver.\n\n## Cylinder 3 — Reputation: are you getting chosen?\n\n**What it does:** a steady flow of real reviews that turns a search into a booked call.\n\n**Signs this is your leak:**\n- You show up *and* look credible, but the phone still doesn't ring.\n- You have noticeably fewer (or older) reviews than the competitor who beats you.\n- Your rating is fine but the review count is thin.\n\nReputation is where visibility converts into a decision. If this is your leak, you're being seen and skipped. I've written on [why the business with more reviews wins even when it's worse](/journal/why-more-reviews-wins-even-when-youre-better) — it's the cylinder most owners underestimate.\n\n## Cylinder 4 — Retention: are you keeping who you already won?\n\n**What it does:** bringing back the customer you already paid to acquire — your cheapest, warmest revenue.\n\n**Signs this is your leak:**\n- You're constantly chasing *new* customers and rarely hear from past ones.\n- No system brings people back — no follow-up, no reminders, no reason to return.\n- You'd struggle to name your repeat-customer rate.\n\nThis is the quietest leak because the business still *feels* busy — but you're refilling a leaking bucket. I cover it in [the customer you already paid for](/journal/the-customer-you-already-paid-for).\n\n## The honest diagnostic\n\nRead back through the four. Usually **one** set of symptoms will feel uncomfortably familiar — that's your leaking cylinder. And there's an order to it: the cylinders feed each other in sequence. Visibility feeds authority, authority feeds reputation, reputation feeds retention. A dead early cylinder starves every one after it, which is why fixing \"more reviews\" does nothing if the real problem is that nobody finds you in the first place. Start with the earliest cylinder showing symptoms.\n\n## The three-step process to get the revenue back\n\nOnce you know which cylinder is leaking, getting it back is a straightforward three steps — the same process I run for every client.\n\n**Step 1 — Diagnose.** Confirm the leak precisely. A guess is expensive; the [Local Visibility Diagnostic](/services) finds exactly which cylinder is down and why, so you fix the real problem instead of the loudest symptom.\n\n**Step 2 — Rebuild the cylinder.** Stand up only what that cylinder needs. A visibility leak means the profile, local SEO, and getting found in AI. An authority leak means relevant citations — often the fastest fix, because you can [plug into authority that already exists](/journal/you-dont-start-from-scratch-the-marketplaces-i-built) instead of building it from scratch. A reputation leak means a review system. A retention leak means a follow-up system.\n\n**Step 3 — Run and tune.** A rebuilt cylinder isn't \"set and forget.\" Markets move and competitors react, so the engine needs ongoing tuning to keep firing. This is the difference between a one-time bump and revenue that compounds.\n\n## Where to start\n\nIf reading this made one cylinder obvious, you already know where your revenue is leaking. The next step is confirming it precisely rather than guessing — which is exactly what [the diagnostic](/services) is for. For the broader industry view on how these signals fit together, [Google's guidance on local ranking](https://support.google.com/business/answer/7091) is a solid outside reference. Find the dead cylinder, rebuild it, and keep it tuned — that's how the engine runs while you work."
    },

      "body": "HolisticDentalCare.net is one of the [visibility engines I've built](/marketplace) — and for a biological or holistic dental practice, it's one of the fastest paths to being found by the exact patients you want. Here's what it is and what a listing actually does for your practice.\n\n## What it is\n\nIt's a national patient directory and education hub for biological and holistic dentistry. It lists 150+ practices, hosts over 1,000 patient guides, and — the number that matters most — pulls **more than 7,000 visitors a month.** These aren't random visitors. They're people actively researching mercury-free care, ozone therapy, ceramic implants, and the oral-systemic connection, and deciding where to go.\n\n## What a listing does for your practice\n\n**You get in front of assembled demand.** Instead of waiting for your own site to rank, your practice appears on a destination those 7,000 monthly patients already visit. That's visibility you'd spend months building alone.\n\n**You inherit a relevant authority citation.** A listing on a trusted, industry-specific site is exactly the kind of off-page signal that lifts your own local rankings — the authority I describe in [how I build authority faster](/journal/how-to-build-local-authority-faster). You can't manufacture this on your own website.\n\n**AI starts surfacing you.** Because the site is structured to be read and cited by AI assistants, a listed practice becomes part of how AI answers \"find me a biological dentist near me.\" That's the emerging channel I cover in [the search that no longer goes to Google](/journal/the-search-that-no-longer-goes-to-google).\n\n## Why it works from day one\n\nThe patients on HolisticDentalCare are already sold on the specialty — they search by discipline and they travel for care, exactly the behavior I break down in [how patients find a biological dentist](/journal/how-do-patients-find-a-biological-dentist). A listing meets them at the moment of decision. For the clinical background patients themselves rely on, the [Holistic Dental Association](https://holisticdental.org) is a useful reference.\n\nIf you run a biological practice and want to be one of the practices these patients find, [see the marketplace](/marketplace) — this is the engine already running for your market."

      "body": "MercuryFreeDental.com is one of the [visibility engines I've built](/marketplace), but it works differently from the others — and for the right practice, that difference is its strength. Here's how it helps a mercury-safe dental practice get chosen.\n\n## A different model: trust, not placement\n\nMost directories rank businesses by who signed up. MercuryFreeDental is built as a neutral, medically-reviewed, education-first resource — 50+ evidence-aware patient guides, transparent sourcing, and deliberately no affiliate links. It carries a proprietary **Mercury Safety Score™** that rates providers on disclosed safety practices: rubber dam isolation, high-volume evacuation, HEPA air filtration, patient education.\n\nThe result is a resource patients *trust* precisely because it isn't selling to them. And that trust is exactly what transfers to the practices listed on it.\n\n## What it does for your practice\n\n**Credibility patients can verify.** A strong Mercury Safety Score is a transparent, third-party signal that you follow the protective protocols patients are specifically looking for. That's more persuasive than any ad, because the patient found it on a source they trust.\n\n**The authority signal that matters.** A citation from a neutral, well-sourced, medically-reviewed site is high-quality off-page authority — the kind that both lifts local rankings and, crucially, is exactly what AI weighs when deciding who to recommend. This is the mechanism behind [how I build authority faster](/journal/how-to-build-local-authority-faster).\n\n**You reach the careful researcher.** The patients here are reading before they book — comparing providers, learning the SMART protocol, deciding carefully. They're high-intent and they'll travel, the exact audience I cover in [SMART amalgam removal: getting found by the patients searching for it](/journal/smart-amalgam-removal-getting-found-by-patients-searching).\n\n## Why the difference is the advantage\n\nFor a practice that genuinely follows mercury-safe protocols, a resource that *rewards transparency* is the ideal place to be seen — you're recognized for exactly what makes you worth choosing. It pairs naturally with ranking for the direct searches, which I cover in [how to rank for \"mercury-free dentist near me\"](/journal/how-to-rank-for-mercury-free-dentist-near-me). The clinical standard behind the score is the IAOMT's SMART protocol; the [IAOMT patient resources](https://iaomt.org/for-patients/) are the authoritative reference.\n\nIf you run a mercury-safe practice, [see the marketplace](/marketplace) to understand how this engine and the others fit together."

      "body": "UpperCervicalDoctors.com is one of the [visibility engines I've built](/marketplace), and it targets what may be the most winnable situation in local search. Here's what it is and what a listing does for an upper cervical practice.\n\n## What it is\n\nIt's a specialty directory for upper cervical chiropractic — NUCCA, Blair, Atlas Orthogonal — the disciplines patients seek out by name after often trying everything else. It connects those high-intent, motivated patients with the practitioners who do the specific technique they're looking for.\n\n## Why this niche is so winnable\n\nTwo things make upper cervical unusually favorable, both of which I cover in the [complete guide to local SEO for upper cervical chiropractic](/journal/local-seo-for-upper-cervical-chiropractic): the patients are deeply motivated and willing to travel, and the competition for the specialty searches is thin. Far fewer practices optimize for \"NUCCA near me\" than for \"chiropractor,\" because far fewer are that. A directory built specifically for the niche lets you own that search.\n\n## What a listing does for your practice\n\n**You appear for the exact search.** A listing puts your practice in front of patients searching the precise technique — the moment of highest intent. These patients travel, as I explain in [upper cervical patients travel for care](/journal/upper-cervical-chiropractic-distance-patients-google-business-profile), so your reach is regional, not just local.\n\n**You get a relevant authority citation.** A listing on a discipline-specific directory is off-page authority that lifts your own rankings and signals the specialty to both Google and AI — the core idea in [how I build authority faster](/journal/how-to-build-local-authority-faster).\n\n**No ramp-up.** Because the directory already exists and ranks, you get visibility right away rather than building it from scratch — the principle behind [why you don't start from zero](/journal/you-dont-start-from-scratch-the-marketplaces-i-built).\n\nFor the clinical background patients reference, the [International Chiropractors Association's upper cervical resources](https://www.icausa.com) are a useful outside source. If you run an upper cervical office, [see the marketplace](/marketplace) — this engine is already running for your discipline."

      "body": "SiouxFallsGo.com is one of the [visibility engines I've built](/marketplace) — and unlike the specialty directories, it's hyper-local. Here's what it does for a Sioux Falls business.\n\n## What it is\n\nIt's a community-first directory for Sioux Falls: locals use it to discover trusted businesses across home services, trades, food, and retail — and giveaways pull the community in and keep them coming back. It ranks for the community and category searches residents actually make.\n\n## What a feature does for your business\n\n**You reach your actual local market.** A feature puts you in front of the people most likely to hire you — locals searching for what you do, in the town where you do it. For a home service business, that's the whole game.\n\n**Immediate local visibility.** Because the directory already ranks and has community traffic, a featured business gets seen right away — no waiting for your own SEO to warm up. That's the no-ramp-up principle from [why you don't start from scratch](/journal/you-dont-start-from-scratch-the-marketplaces-i-built).\n\n**A trusted local citation.** A listing on a recognized local hub is a local authority signal — it helps your own Google rankings and, increasingly, how AI recommends local businesses. This is the off-page authority I break down in [how I build authority faster](/journal/how-to-build-local-authority-faster).\n\n**It compounds with a wider reach.** Local visibility pairs naturally with capturing customers just outside your immediate area, which I cover in [how contractors win jobs two towns over](/journal/win-contractor-jobs-outside-your-city-google-business-profile).\n\n## Why community-first works\n\nPeople trust recommendations that feel local and genuine more than ads. A directory the community actually uses — for discovery and for giveaways — lends that trust to the businesses on it. For the broader case on why local reputation drives hiring decisions, the [BBB's guidance for consumers](https:/       "body": "If you run a biological or holistic dental practice, the single most useful thing you can understand is how your future patients actually search — because they don't search like a normal dental patient at all. Get this right and everything else about your marketing follows. This is a companion to my [complete guide to local SEO for holistic dentistry](/journal/local-seo-for-holistic-dentistry).\n\n## They decide first, then search\n\nA regular patient types \"dentist near me\" and picks something close. A biological-dentistry patient has usually already decided *what* they want — mercury-free, biocompatible, whole-body care — often after weeks of reading. By the time they open Google, they're not shopping for \"a dentist.\" They're hunting for a specific kind of practice, and they'll widen the map to find it.\n\n## They search by specialty, not by neighborhood\n\nThis is the crucial difference. Your future patients type things like \"biological dentist,\" \"mercury-free dentist,\" \"holistic dentist near me,\" \"SMART amalgam removal,\" or \"ozone dentistry.\" They search by *discipline*. If your online presence is optimized like a general dentist's — generic category, generic copy — you're invisible for the exact searches that would have brought you the patient who was already sold.\n\n## They'll travel\n\nBecause they've decided what they want, distance is rarely the dealbreaker. They'll drive an hour, two hours, sometimes across a state line. I wrote a whole piece on this: [your best patients will drive two hours — can they find you?](/journal/holistic-dentistry-patients-who-drive-hours-google-business-profile) The practical upshot is that your \"service area\" is far bigger than your neighborhood, and your Google Business Profile should reflect that.\n\n## They read reviews like their decision depends on it\n\nFor a patient about to travel and pay out-of-pocket for out-of-network care, reviews are the whole decision. They read them closely, and they trust specifics — what someone came for, how far they drove. Encouraging patients to mention both in reviews is the most powerful, and cheapest, marketing you have.\n\n## What to do with this\n\nOnce you understand that patients search by specialty and travel to find it, the to-do list writes itself: name the disciplines plainly everywhere, claim a wide service area, and gather specific reviews. The mechanics of the profile itself are in my guide to [Google Business Profile for holistic dental practices](/journal/google-business-profile-for-holistic-dental-practices).\n\nFor the clinical and consumer background on why patients seek this care in the first place, the [Holistic Dental Association](https://holisticdental.org) is a useful outside reference. But the marketing truth is simple: the demand is motivated and already looking. Your only job is to be findable for the specialty they've already chosen."

dy flow of reviews keeps it strong. Ask patients to mention what they came for and how far they traveled — it persuades the next patient and signals your specialty and service area to Google at once.\n\n## Keep it accurate everywhere\n\nYour name, address, and phone on the profile must match what appears everywhere else online. Google's own [guidance on how businesses rank locally](https://support.google.com/business/answer/7091) makes clear that consistency and completeness drive prominence. Get the profile right, keep it consistent, and you become findable for the exact patients already searching for what you do.\n\nFor the deeper patient-behavior context, see [how patients find a biological dentist](/journal/how-do-patients-find-a-biological-dentist)."

hey came for in their own words.\n\n## Make the page match the promise\n\nWhen a patient clicks through, the page should immediately confirm they're in the right place — the service named, explained, and easy to book. For the clinical framework behind mercury-safe removal, the [IAOMT's SMART protocol](https://iaomt.org/for-patients/) is the authoritative reference patients themselves often find. Match their language, win the map, and cast a wide net, and \"mercury-free dentist near me\" becomes a search you own."

      "body": "SMART amalgam removal — the Safe Mercury Amalgam Removal Technique — is exactly the kind of service that makes biological dentistry such a winnable niche. Patients search for it by name, they've already decided they want it, and they'll travel to a practice that's properly certified. If you offer it and you're not ranking for it, you're leaving pre-sold patients on the table. Here's how to get found. This is part of my [complete guide to local SEO for holistic dentistry](/journal/local-seo-for-holistic-dentistry).\n\n## A high-intent, low-competition search\n\nSomeone searching \"SMART amalgam removal near me\" isn't browsing — they know precisely what they want and are ready to book. And because far fewer practices optimize for this specific term than for \"dentist,\" the competition is thin. High intent plus low competition is close to an ideal search to target.\n\n## Name the service explicitly\n\nThe mistake practices make is describing it vaguely — \"safe filling removal\" — instead of the term patients actually search. Name it: SMART amalgam removal, mercury-safe removal, IAOMT SMART certified. Put it in your Google Business Profile services, your description, and a dedicated page on your site. The exact language is what matches the exact search. I cover the profile side in detail in [Google Business Profile for holistic dental practices](/journal/google-business-profile-for-holistic-dental-practices).\n\n## Lead with certification\n\nFor this service, patients specifically look for proper protocol and certification — it's the whole reason they seek out a specialist rather than any dentist. State your certification plainly. It's both a trust signal to patients and a relevance signal to search.\n\n## Expect them to travel\n\nPatients will drive a long way for certified SMART removal — this is a service people cross regions for. Your service area and expectations should reflect that, as I explain in [your best patients will drive two hours](/journal/holistic-dentistry-patients-who-drive-hours-google-business-profile).\n\n## Reviews close it\n\nA patient about to travel for this procedure reads reviews closely. Reviews that name the procedure and the distance traveled are gold — they reassure the next patient and reinforce your relevance. For the clinical standard patients reference, the [IAOMT](https://iaomt.org/for-patients/) is the authoritative source. Name the service, lead with certification, cast a wide net, and SMART amalgam removal becomes one of the most reliable patient sources your practice has."

    {
      "slug": "do-citations-still-matter-for-local-seo-2026",
      "title": "Do citations still matter for local SEO in 2026?",
      "date": "2026-03-12",
      "status": "published",
      "author": "Francis John",
      "baked": true,
      "pillarRef": "how-to-build-local-authority-faster",
      "excerpt": "Citations aren't the ranking rocket they were a decade ago — but writing them off is a mistake, especially now that AI search reads them too. Here's what citations actually do in 2026, and where they still move the needle.",
      "tags": [
        "Local SEO",
        "Authority"
      ],
      "relatedSlugs": [
        "how-to-build-local-authority-faster",
        "7-ways-to-get-your-local-business-cited-by-ai-search"
      ],
      "body": "Ask around and you'll hear two confident, opposite answers: \"citations are dead\" and \"citations are everything.\" Both are wrong. Here's the honest 2026 picture.\n\n## What a citation actually is\n\nA citation is any mention of your business's name, address, and phone number (NAP) online — a directory listing, a chamber page, a niche marketplace. It doesn't have to link to you. The mention itself is the signal.\n\n## What changed\n\nA decade ago, sheer citation volume could move rankings — so people mass-blasted their business into hundreds of directories. Google got smarter and that stopped working. Volume for its own sake does nothing now, and a lot of low-quality citations can even look spammy. That's the grain of truth behind \"citations are dead.\"\n\n## What didn't change — and why they matter more now\n\nWhat citations still do is **confirm you're real and consistent.** Google cross-references your NAP across the web to verify you're a legitimate, established business. Inconsistent details (an old address here, a wrong phone there) quietly erode that confidence. Consistent citations reinforce it. That verification role never went away.\n\nAnd there's a new reason they matter: **AI search reads them too.** When an AI assistant weighs whether to recommend you, it looks at how you're described across the web — and citations are a big part of that footprint. I covered this in [7 ways to get your local business cited by AI search](/journal/7-ways-to-get-your-local-business-cited-by-ai-search). So citations arguably matter *more* in 2026 than five years ago — just not the way people used to game them.\n\n## The 2026 rule\n\nQuality and consistency over volume. A handful of accurate citations on relevant, trusted sites beats hundreds of scattershot ones. The most valuable are the *relevant* ones — a listing on a site actually about your industry or city, which doubles as real authority. That's exactly what I build with my [niche marketplaces](/marketplace), and it's part of the broader approach in [how I build authority faster](/journal/how-to-build-local-authority-faster).\n\nIf you want the industry's ongoing take on this, Moz's [local search resources](https://moz.com/learn/seo/local) track how these signals evolve. But the short answer to the question: yes, citations still matter — as verification and as AI fuel — as long as they're consistent and relevant."
    },
    {
      "slug": "how-to-get-backlinks-for-a-local-business-without-blogging",
      "title": "How to get backlinks for a local business (without blogging)",
      "date": "2026-03-16",
      "status": "published",
      "author": "Francis John",
      "baked": true,
      "pillarRef": "how-to-build-local-authority-faster",
      "excerpt": "You don't need to run a blog to earn the backlinks that build local authority. Here are the ways a local business can get real, relevant links — most of which take a phone call or an afternoon, not a content calendar.",
      "tags": [
        "Local SEO",
        "Authority"
      ],
      "relatedSlugs": [
        "how-to-build-local-authority-faster",
        "do-citations-still-matter-for-local-seo-2026"
      ],
      "body": "Most advice on backlinks assumes you'll churn out blog posts and hope someone links to them. For a plumber or a dental practice, that's neither realistic nor necessary. Backlinks are just other trusted sites vouching for you, and a local business has ways to earn them that have nothing to do with blogging.\n\n## Why backlinks matter (the short version)\n\nA backlink from a trusted, relevant site is one of the strongest authority signals there is — it's the web's version of a referral. This is the off-page authority I describe in [how I build authority faster](/journal/how-to-build-local-authority-faster): you can't declare it yourself, others confer it. Here's how to earn it without writing a word of content.\n\n## 1. Get listed on relevant directories and marketplaces\n\nThe fastest relevant link is a listing on a site that's actually about your industry or city. It's a link *and* a citation at once. This is the core of what I build with [niche marketplaces](/marketplace) — a trusted, relevant link earned on day one.\n\n## 2. Local sponsorships and organizations\n\nSponsor a youth team, join the chamber of commerce, support a local event. These almost always come with a link from an organization Google already trusts locally — and they're genuinely good for business besides.\n\n## 3. Supplier and partner pages\n\nYour suppliers, the brands you carry, the partners you work with — many have \"where to find us\" or \"our partners\" pages. Ask to be listed. These links are relevant by definition.\n\n## 4. Local press and \"best of\" lists\n\nLocal news, community blogs, and \"best [service] in [city]\" roundups link to the businesses they feature. A short, genuine pitch — or simply being good enough to get noticed — earns these.\n\n## 5. Testimonials you give\n\nGive a testimonial to a product or service you actually use, and many will publish it with a link back to your site. It takes ten minutes.\n\n## The honest caveat\n\nDon't buy links or chase irrelevant ones — Google discounts or penalizes those, and they do nothing for AI either. Relevance and trust are the whole game. The [Google Search Central guidelines](https://developers.google.com/search/docs/essentials) are clear that links should be earned, not manufactured. Everything above is earned, relevant, and doesn't require you to become a publisher.\n\nPair these with consistent citations — I covered [whether those still matter in 2026](/journal/do-citations-still-matter-for-local-seo-2026) — and you're building real authority without a blog."

    {
      "slug": "why-does-my-competitor-outrank-me-with-a-worse-website",
      "title": "Why does my competitor outrank me with a worse website?",
      "date": "2026-03-22",
      "status": "published",
      "author": "Francis John",
      "baked": true,
      "pillarRef": "how-to-build-local-authority-faster",
      "excerpt": "It's one of the most frustrating things in local search: your site looks better, your work is better, and yet the competitor down the road ranks above you. Here's what's actually happening — and it's almost never about the website.",
      "tags": [
        "Local SEO",
        "Authority"
      ],
      "relatedSlugs": [
        "how-to-build-local-authority-faster",
        "why-more-reviews-wins-even-when-youre-better"
      ],
      "body": "You've seen their website. It's dated, slow, maybe a little ugly. Yours is clean and modern. And yet when you search, they're on top and you're on page two. It feels broken. It isn't. Here's what's really going on — because the website is rarely the reason.\n\n## Ranking isn't a beauty contest\n\nGoogle doesn't rank the prettiest site. It ranks the one it trusts most to answer the search. A gorgeous website with no authority behind it loses to an ugly one that the rest of the web vouches for. That's the whole surprise in one sentence: **you're not being out-designed, you're being out-trusted.**\n\n## What your competitor probably has that you don't\n\n**Authority.** They've likely been around longer, been linked and cited more, and accumulated the off-page trust I describe in [how I build authority faster](/journal/how-to-build-local-authority-faster). That trust outweighs your better design every time.\n\n**Reviews.** More reviews, or a steadier flow of them, signals an active, chosen business. I've written on [why more reviews win even against a better competitor](/journal/why-more-reviews-wins-even-when-youre-better) — it's a huge, underrated ranking factor.\n\n**A dialed-in Google Business Profile.** For local search, the profile often matters more than the website. If theirs has the right categories, real service areas, and complete info and yours doesn't, they win the map regardless of site quality.\n\n**Consistency and time.** Their NAP is consistent everywhere; they've simply existed longer and Google trusts them more. Time is a real factor, and it's frustrating precisely because you can't shortcut it by redesigning.\n\n## The good news\n\nDesign being irrelevant cuts both ways. You don't need to out-pretty them — you need to out-*authority* them, and that's buildable. Get listed on relevant, trusted sites (which is exactly what my [marketplaces](/marketplace) provide), earn reviews steadily, and get your profile right. Those close the gap that a redesign never could.\n\nIf you want the outside view, [Google's own guidance on local ranking factors](https://support.google.com/business/answer/7091) confirms it: relevance, distance, and prominence — not aesthetics. Prominence is authority, and authority is the lever. Your better website will help you *convert* once you're found. First you have to get found, and that's an authority problem, not a design one."
    },

      "slug": "how-long-does-local-seo-take-to-actually-work",

      "date": "2026-03-28",
      "status": "published",
      "author": "Francis John",
      "baked": true,
      "pillarRef": "how-to-build-local-authority-faster",
      "excerpt": "The honest answer is months, not weeks — because trust takes time to build. But there's a real way to get visibility almost immediately while the slow part catches up. Here's the realistic timeline, and the shortcut.",
      "tags": [
        "Local SEO",
        "Authority"

      "relatedSlugs": [

        "you-dont-start-from-scratch-the-marketplaces-i-built"
      ],
      "body": "Every honest local SEO answer to this question starts the same way: it depends — and it's slower than you want. Let me give you the real timeline, why it's slow, and the one legitimate way to get results faster.\n\n## The realistic timeline\n\nFor a typical local business starting fresh, expect meaningful movement in **three to six months**, with the bigger gains often landing after six. Some things move faster — a well-optimized Google Business Profile can start showing improvement in weeks — but ranking for competitive searches and building durable authority is a months-long process.\n\n## Why it's slow\n\nThe slow part is trust. Google is deliberately cautious about a business it doesn't know yet — it waits to see whether other sites reference you, whether your listings stay consistent, whether reviews accumulate, whether it all holds up over time. That waiting period is the lag every business feels at the start. Nothing is broken; trust simply hasn't accrued yet. I explain the mechanics in [how I build authority faster](/journal/how-to-build-local-authority-faster).\n\n## What makes it faster (and what doesn't)\n\n**Doesn't help:** paying for shortcuts, buying links, stuffing keywords. These either do nothing or actively hurt.\n\n**Does help:** a fully optimized Google Business Profile, a steady flow of reviews, consistent citations, and — the biggest lever — relevant authority you don't have to build from scratch.\n\nThat last one is the real shortcut. If the authority already exists somewhere trusted and you can get inside it, you skip the slowest part of the wait. That's the entire idea behind my [marketplaces](/marketplace), and I've written about [why my clients don't start from scratch](/journal/you-dont-start-from-scratch-the-marketplaces-i-built) — a listing on a site that already ranks gives you visibility right away, while your own authority catches up underneath.\n\n## Setting the right expectation\n\nThink of it as two clocks running at once. The slow clock — your own site's durable authority — takes months, and there's no honest way around that entirely. The fast clock — visibility from an already-ranking marketplace, a dialed-in profile, fresh reviews — can start almost immediately. Good local SEO runs both: quick wins now, compounding authority later.\n\nFor an outside benchmark, [Google's local ranking guidance](https://support.google.com/business/answer/7091) makes clear that prominence builds over time. So the honest answer is: months to fully work — but you don't have to be invisible while you wait, if you start on an engine that's already running."

      "body": "More of your future customers are asking an AI assistant for a recommendation instead of scrolling Google. When they do, the AI names a few businesses and skips the rest. Why those and not you? Because AI decides who to cite based on signals you can influence — and most local businesses aren't touching a single one of them. Here are seven, roughly in order of impact.\n\nThis is a companion to my [guide on building local authority faster](/journal/how-to-build-local-authority-faster) — citations by AI are authority made visible.\n\n## 1. Get mentioned on sites AI already trusts\n\nAI weighs how you're described *across the web*, not just on your own site. A mention on a relevant, trusted third-party site is the strongest single signal you can earn. This is exactly why I build [niche marketplaces](/marketplace) — a listing on one is a trusted, relevant citation that AI reads. If you do one thing from this list, make it this one.\n\n## 2. Keep your name, address, and phone identical everywhere\n\nAI cross-references your business across sources. If your details conflict from one listing to the next, it can't confidently identify you as one entity — so it hedges by leaving you out. Pick one exact format and use it everywhere, down to the suite number.\n\n## 3. Answer the questions customers actually ask\n\nAI loves to quote plain, direct answers to real questions. A page or profile that answers \"how much does X cost\" or \"do you serve Y area\" in clear language is quotable. Vague marketing copy is not. Write the way a helpful person would answer out loud.\n\n## 4. Accumulate real reviews, steadily\n\nReviews are proof AI reads as consensus. A steady trickle beats a sudden pile, and specifics (\"came out to Brandon, fixed the line same day\") are gold because they carry facts AI can cite. I've written on [why more reviews win even against a better competitor](/journal/why-more-reviews-wins-even-when-youre-better) — the same dynamic drives AI recommendations.\n\n## 5. Get your Google Business Profile exactly right\n\nYour profile is a primary source for AI about local businesses. The right categories, real service areas, and complete details all feed it. If yours isn't dialed in, start with my guides on [service areas](/journal/how-to-set-service-areas-google-business-profile) and [matching your service pages to your categories](/journal/why-your-service-pages-should-mirror-your-google-categories).\n\n## 6. Name your specialty, in plain words\n\nIf you do something specific — biological dentistry, upper cervical care, a particular trade — say so explicitly and often. AI matches specific queries to specific providers. Generic \"quality service\" language matches nothing. My guides on [holistic dentistry](/journal/local-seo-for-holistic-dentistry) and [upper cervical chiropractic](/journal/local-seo-for-upper-cervical-chiropractic) show how specialty language wins the specialty search.\n\n## 7. Build a footprint, not just a website\n\nOne website is one source. A business that shows up across a directory, a marketplace, reviews, and consistent listings gives AI many corroborating sources — which is what turns a \"maybe\" into a confident recommendation. Authority is a footprint, not a page. I break the whole approach down in [how I build authority faster](/journal/how-to-build-local-authority-faster).\n\n## Where to start\n\nIf this feels like a lot, it collapses to one idea: **be mentioned, consistently and specifically, on sources AI trusts.** The fastest way in is a trusted third-party citation — which is what my [marketplaces](/marketplace) provide. If you'd like a clear read on where you stand today, that's what [the diagnostic](/services) is for, and you can see how I work across markets at [SAJMedia.co](https://sajmedia.co)."

      "body": "Of the four parts of the revenue engine I build — visibility, authority, reputation, retention — authority is the one people understand least and wait longest for. It's also the one that decides whether you rank at all. This is the complete guide to what local authority actually is, why it's slow, and how I compress it.\n\n## What \"authority\" actually means\n\nAuthority is not how good your website looks. It's not how many keywords are on your service page. Authority is the web's collective judgment of whether your business is a real, trusted, established answer to a search — and crucially, **it's conferred by others, not claimed by you.** You can say you're the best plumber in town on your own site all day. It means nothing. When *other trusted sites* say it — by linking to you, citing you, listing you — that's authority.\n\nThat's the first hard truth: authority is off-page. It lives in what the rest of the internet says about you, which is exactly why you can't manufacture it on your own website no matter how well you build it. If you want the on-page side handled well too, that starts with getting the fundamentals right — [service pages that mirror your Google categories](/journal/why-your-service-pages-should-mirror-your-google-categories) and [correctly set service areas](/journal/how-to-set-service-areas-google-business-profile) — but those set the stage. Authority is what gets you cast.\n\n## Why authority is the slow part\n\nGoogle is deliberately cautious about trust. A brand-new business could be anyone. So Google waits — watching whether other sites reference you, whether your listings stay consistent, whether reviews accumulate, whether the signals hold up over time. That waiting period is the lag every business feels at the start of an SEO effort. Nothing is broken; trust simply hasn't accrued yet.\n\nThe conventional way to build it is grind: earn links one at a time, build citations directory by directory, wait for reviews. It works, ines whether AI surfaces and recommends you. I've covered how [search is increasingly not going to Google at all](/journal/the-search-that-no-longer-goes-to-google) — and authority is what wins in that world.\n\nThe practices I work with in specialty markets feel this most acutely. If you run a holistic dental practice or an upper cervical office, the patients researching you are exactly the kind who ask AI for recommendations — which is why I've built dedicated guides on [local SEO for holistic dentistry](/journal/local-seo-for-holistic-dentistry) and [for upper cervical chiropractic](/journal/local-seo-for-upper-cervical-chiropractic).\n\n## The bottom line\n\nAuthority is slow because trust is slow — but the wait is only unavoidable if you insist on building every bit of it from scratch. You don't have to. The fastest path to authority is to plug into authority that already exists, then let the consistent citations, relevant links, and steady reviews compound on top of it.\n\nIf you want to see the engines I'd plug your business into, [they're here](/marketplace). And if you'd rather start with a clear picture of where your authority stands today, that's exactly what [the diagnostic](/services) is for. You can also see how I approach this across markets at [SAJMedia.co](https://sajmedia.co)."

thority, reputation, retention. The marketplaces are how I deliver the first two. Visibility, because the destination is already found. Authority, because a citation from a trusted niche site confers the credibility your own site can't give itself.\n\nThat's the honest version of \"I build the engine.\" For these two cylinders, the engine is already built and already turning. You don't start it from cold. You join something in motion.\n\nI'm building these out one market at a time — more are coming. But if you're in home services, holistic dentistry, or upper cervical care, there's already an engine running for your market. The only question is whether your business is inside it yet. [See the marketplaces](/marketplace), or start with [a diagnostic](/services) to find where your visibility leaks. You can also see how I work across markets at [SAJMedia.co](https://sajmedia.co)."

oking. Everything in local SEO, for you, comes down to one goal: be the practice they find when they finally search for the care they've already chosen.\n\nIf you want to see exactly how I build this for holistic practices, the full breakdown is linked here.",

ey filter by discipline.\n\nIf your Google Business Profile and website read like a general chiropractic clinic — generic category, no mention of the technique — you're invisible for the exact searches that bring your ideal patient. Name the techniques you practice, plainly and everywhere: profile, services, website. These are the words patients type. Vague \"chiropractic care\" language will never match \"NUCCA near me,\" and that's the search that matters.\n\n## Claim the wider map\n\nBecause these patients travel, name the towns and cities across your real draw area on your Google Business Profile, not just your home town. You want to appear when someone an hour or two away searches the technique — for this patient, that distance is well within range, and they are often the most committed patient you'll ever treat.\n\n## Reviews prove travel is normal\n\nA patient considering a two-hour drive to a practitioner they found online needs to see that others did the same and were glad. Reviews provide that reassurance and signal your service area to Google at once.\n\nAsk patients to mention **what brought them** and **how far they came**. \"Drove three hours after years of headaches — first real relief I've had\" is marketing you cannot buy. It tells the next searching patient that traveling for this is what people do, and it tells Google you serve a wide region.\n\n## The opportunity\n\nHigh intent, motivated patients, willingness to travel, and thin competition for the exact search — for local SEO, that's about as good as it gets. The demand is real and actively looking. The patients are the most committed you'll treat. The only gap is visibility: being the practice that appears when someone finally searches for the specific care they've decided they need. Close that gap, and the whole region opens up.",

      "author": "Francis John",

      "excerpt": "Your best jobs are often 30–40 minutes away — but Google shows you to the people right next door. Here's how to make your Google Business Profile pull work from the whole region you actually serve.",

      "projectSlug": "",
      "body": "Most contractors quietly accept a smaller map than the one they actually work. You'll drive 40 minutes for the right job — a full remodel, a re-roof, a big HVAC install — but the phone mostly rings from the few blocks around your shop. That's not because the far-away work isn't there. It's because Google is showing you to the wrong half of your region.\n\nHere's the mechanism, and how to fix it.\n\n## Why the good jobs don't call\n\nGoogle decides who to show in the map for a search like \"kitchen remodel near me\" based heavily on **proximity** — how close the business is to the person searching. If your Google Business Profile is pinned to your shop on the edge of town, someone searching two towns over sees the contractors near *them*, not you. You never appear, so you never get the call, so you assume the demand isn't there. It is. You're just invisible for it.\n\nThe larger, higher-margin jobs are disproportionately the ones worth traveling for. So the exact work you most want is the work proximity is hiding you from.\n\n## The service-area setup most contractors get wrong\n\nA Google Business Profile can be set up two ways: as a **storefront** with a visible address, or as a **service-area business** that hides the address and instead lists the areas you serve. Contractors who go to the customer — not the other way around — should almost always be the second kind.\n\nBut listing service areas is where it goes wrong. Two common mistakes:\n\n**Listing your whole county as one area.** It feels efficient. It's weak. A giant, vague area tells Google little about where you actually work and dilutes your relevance everywhere. You end up mediocre across a wide zone instead of strong in the towns that matter.\n\n**Listing only your home town.** The opposite problem — you've told Google you're a local-only operation, and it obliges by keeping you local.\n\nThe stronger approach: list the **specific towns and neighborhoods** you genuinely serve and want more of, named individually. Each named place is a signal. A profile that names the eight towns you actually work reads very differently to Google than one that says \"Countyname\" or just your home city.\n\n## Make the whole profile speak to the wider region\n\nService areas are one signal. The rest of the profile has to back it up, or Google won't believe you work where you say:\n\n- **Your services and descriptions** should mention the kind of work and, naturally, the region — not keyword-stuffed, but written like someone who works across the area.\n- **Your reviews** are the strongest proof. A review that says \"drove out to Farmington and re-roofed our place\" tells Google — and every future customer — that you really do work in Farmington. Ask happy customers in the outer towns to mention where they are when they leave a review. It's the single most powerful distance signal you have, and it's free.\n- **Your photos** of completed jobs, ideally recognizable as being in different towns, reinforce the same thing.\n\n## The honest part\n\nTwo things worth saying plainly. First, proximity never fully goes away — you will always rank more easily near your base than an hour out. The goal isn't to dominate the whole region equally; it's to *appear at all* in the outer towns where you're currently invisible, so the big jobs can find you. Even moving from \"never shows\" to \"shows on page one\" in a town 30 minutes out can add jobs a year that dwarf the effort.\n\nSecond, this rewards consistency. The profile that names its real service areas, collects reviews from those areas, and keeps posting real work will keep widening its map. The one set up once and forgotten stays pinned to the shop.\n\nIf you're driving past good jobs to get to smaller ones closer to home, your map is smaller than your business. That's fixable — and it's usually the highest-return thing a contractor can do with an afternoon.",

      "body": "There's a fact about biological and holistic dentistry that changes the entire marketing problem: your patients will travel. They research for weeks. They join the forums and the Facebook groups. They decide they want mercury-free, biocompatible, whole-body care *before* they ever open a map. And then they will happily drive an hour, two hours, sometimes across a state line, to get it.\n\nThat's a gift most local businesses never get. A general dentist competes on \"close and convenient.\" You compete on \"worth the drive.\" But it only works if the patient can find you when they finally search — and that's exactly where most holistic practices lose them.\n\n## The patient is searching for the specialty, not the neighborhood\n\nA regular dental patient searches \"dentist near me.\" A holistic patient searches for what they actually want: \"biological dentist,\" \"mercury-free dentist,\" \"SMART amalgam removal,\" \"ozone dentistry.\" They're searching by *discipline*, and often willing to widen the map to find it.\n\nHere's the problem: if your Google Business Profile is optimized like a general dentist's — pinned tight to your address, categorized generically — you're invisible for the specialty searches that your ideal patients actually type. You're competing on proximity in a game your patients aren't even playing.\n\n## Get the profile to match how they search\n\n**Categories first.** Google Business Profile lets you set a primary category and additional ones. Most holistic practices leave it at \"Dentist\" and stop. If categories like \"Cosmetic dentist\" or \"Holistic\" fits are available and accurate, use every relevant one — they tell Google what kind of practice you are, which is what the specialty searcher is filtering for.\n\n**Say the specialty everywhere, plainly.** Your profile description, your services list, your website — all should name the actual disciplines: biological, biocompatible, mercury-free, whole-body. Patients search these exact words. If your profile speaks in general-dentistry language, you won't match the search that would have driven someone two hours to your door.\n\n**Service areas and the wider map.** Because your patients travel, name the broader region — the towns and cities within driving range that you draw from, not just your immediate suburb. You want to appear when someone an hour away searches the specialty, because for this patient, an hour is nothing.\n\n## Reviews do the heavy lifting\n\nFor a patient about to drive two hours and spend real money on out-of-network care, reviews aren't a nice-to-have — they're the whole decision. And they do double duty: they persuade the patient *and* they signal to Google.\n\nEncourage patients to mention two things in reviews: **what they came for** (the specific holistic service) and **where they traveled from**. \"Drove up from two hours away for SMART amalgam removal, worth every minute\" is worth more than any ad you could buy. It tells the next distance patient they're not crazy to travel, and it tells Google you genuinely serve that wider area.\n\n## Why this matters more for you than for anyone\n\nMost local businesses fight over a small radius because their customers won't travel. Yours will. That means the ceiling on your practice isn't your neighborhood — it's the whole region of people who want what you specifically do. The only thing standing between you and those patients is whether you show up when they finally search for the specialty they've already decided on.\n\nThat's a solvable problem, and it's a better problem to have than almost any other practice in town. The demand is real, motivated, and already looking. Make sure the practice they find is yours.\n\nIf you want to see exactly how I build this for holistic practices, the details are here.",

      "excerpt": "Upper cervical is a discipline patients seek out by name, often after years of searching — and they'll drive for it. The practices that win them show up for the specialty across a wide radius. Here's how to be found.",

      "body": "Upper cervical chiropractic has an unusual patient: someone who has often tried everything else first. They've been through the general chiropractors, the specialists, sometimes years of it, and then they discover upper cervical specifically — NUCCA, Blair, Atlas Orthogonal — and they go looking for it on purpose. When they find a practitioner, distance is rarely the objection. They'll drive.\n\nThat makes the marketing problem simple to state and easy to get wrong: your future patients are actively searching for the exact thing you do, from a wide area, and the only question is whether you appear when they search. Most practices don't, and it has nothing to do with the quality of their care.\n\n## They search by name — so your profile must speak by name\n\nThe upper cervical patient doesn't search \"chiropractor near me.\" By the time they find you, they know the vocabulary. They search \"NUCCA chiropractor,\" \"upper cervical near me,\" \"Atlas Orthogonal,\" \"Blair technique.\" They're filtering by discipline, and they'll widen the radius to find it.\n\nIf your Google Business Profile reads like a general chiropractic clinic — generic category, no mention of the technique, pinned tight to your address — you are invisible for the exact searches that would bring you your ideal patient. You're competing on \"closest chiropractor\" when your patient is searching for \"the specific practitioner worth traveling to.\"\n\n## Setting the profile up to be found\n\n**Name the technique, everywhere.** Your profile description, services, and website should state plainly which upper cervical methods you practice. These are the words patients type. Vague \"chiropractic care\" language will never match \"NUCCA near me,\" and that's the search that matters.\n\n**Use every accurate category.** Set your categories as specifically as Google allows. The more precisely your profile describes what you actually do, the better you match the specialty searcher who's filtering for it.\n\n**Claim the wider map.** Because these patients travel, name the towns and cities across your real draw area, not just your home town. You want to surface when someone an hour or two away searches the technique — for this patient, that distance is well within range, and they're often the most committed patient you'll ever treat.\n\n## Reviews are proof that travel is normal\n\nA patient considering a two-hour drive to a practitioner they found online needs reassurance that other people did the same and were glad. Reviews provide it — and they signal your service area to Google at the same time.\n\nAsk patients to mention, naturally, **what brought them** and **how far they came**. \"Drove from three hours away after years of headaches — first real relief I've had\" is the most persuasive marketing you could possibly have, and you can't buy it. It tells the next searching patient that traveling for this is not only reasonable, it's what people do. And it tells Google you serve a genuinely wide region.\n\n## The opportunity hiding in a narrow discipline\n\nHere's what makes upper cervical unusually winnable: the competition for these specialty searches is thin. Far fewer practices optimize for \"NUCCA\" or \"Blair technique\" than for \"chiropractor,\" because far fewer *are* that. High intent, motivated patients, willing to travel, and a short list of competitors for the exact search — that's close to an ideal local marketing situation.\n\nThe demand is real and it's actively looking. The patients are the most committed you'll treat. The only gap is visibility — being the practice that appears when someone finally searches for the specific care they've decided they need. Close that gap, and the wider region opens up.",

      "body": "There are two ways to put me to work for your business. Same person, same systems — but two very different arrangements, and the right one depends entirely on where your business is. Here's the honest breakdown of each, and when I'd point you toward one over the other.\n\n## Option one: partner with me on contract\n\nThis is a partnership. You deliver your service; I run the marketing that keeps the right customers finding you. We marry the two — your craft and my systems — so you can serve more people without building a marketing team to do it.\n\nWhat it looks like in practice: I own the visibility, the reputation, and the copy that turns attention into booked work. You stay focused on the thing you're actually great at. The arrangement flexes — we scale it up as you grow, dial it back when you need to, without the fixed weight of a salary.\n\n**The benefits:**\n\n- **Reach without overhead.** You get a full marketing system without hiring, training, or carrying a full-time person.\n- **You do what you're best at.** Your energy stays on your service and your customers, not on learning marketing.\n- **Flexibility.** Contract scales with your business. A busy season and a slow one don't cost you the same.\n- **The person who built it runs it.** You're not handing work to a junior hire — you get me, directly.\n\n**Best when:** you want serious reach and results, but marketing isn't a big enough or steady enough job to justify a full-time salary — or you'd simply rather keep your focus on delivering your service and let a partner handle being found.\n\n## Option two: hire me in-house\n\nHere I join your team and own marketing from the inside. Not a vendor you check in with — a member of the business, in the room, focused on one company: yours.\n\nWhat it looks like: daily, deep focus on a single business. I'm in the meetings, I hear the customer complaints firsthand, I catch the things nobody writes down. The knowledge I build about your business stays in your building.\n\n**The benefits:**\n\n- **Total focus.** One business gets my full attention, every day.\n- **In the room.** I'm part of the decisions as they happen, not reacting from outside.\n- **Knowledge that stays.** Everything I learn about your customers and your market lives inside your company.\n- **Speed.** Constant small decisions get made fast when the person owning marketing is on the team.\n\n**Best when:** marketing is a genuine full-time, permanent function for your business — enough consistent work to fill a real role, and a need for that person to be embedded in the day-to-day.\n\n## How to choose\n\nThe honest test is workload and permanence. If marketing is a steady, full-time, forever part of your business, hiring in-house wins — an embedded person who lives your business beats an outside partner for that. If the work is real but not full-time, or you'd rather stay focused on your service and let someone else own being found, the contract partnership is the better fit — you get the reach without the fixed cost.\n\nEither way, you're working with the person who builds the systems, not an agency reselling someone else's. If you're not sure which fits, that's worth a conversation — tell me about your business and I'll tell you honestly which way I'd go.",

    {
      "slug": "the-search-that-no-longer-goes-to-google",
      "title": "The search that no longer goes to Google",
      "date": "2026-08-06",
      "status": "published",
      "author": "Francis John",
      "excerpt": "A growing share of your customers have stopped searching Google first. They ask an AI which business to call — and it answers with names. Is yours one of them?",
      "cover": "",
      "tags": [
        "AI Search",
        "Local SEO"
      ],
      "projectSlug": "revenueiq",
      "externalLabel": "Google Business Profile Help",
      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "Something changed in the last two years, quietly, and most local businesses have not noticed because it does not show up in the reports they are used to reading.\n\nA meaningful and growing share of people no longer open Google, scroll the map pack, and compare listings. They open ChatGPT, or Perplexity, or they read Google's own AI summary at the top of the page, and they ask a question: *\"who's the best plumber near me?\"* — and the tool answers. Not with ten blue links. With a short list of names, sometimes just one.\n\nIf your business is not one of the names, you were never in the running. The customer never saw a list to scroll. They got an answer, and it was not you.\n\n## Why this is different from regular search\n\nFor twenty years, local search worked one way: rank high enough to be seen, and you had a shot. The customer did the comparing.\n\nAI search removes the comparing. The tool does it, invisibly, and hands the customer a conclusion. That is a profound shift, because there is no page two to fight your way onto and no map pack to crack — there is the answer, and everything else. Being *findable* is no longer the goal. Being *the answer* is.\n\n## How an AI decides who to name\n\nThese tools do not pull names from nowhere. They assemble an answer from what they can read about a business across the web — and the signals they weigh overlap heavily with good local SEO, which is the good news for anyone who has done the work:\n\n- **A complete, consistent presence.** The tool needs to understand clearly what you do, where, and for whom. Gaps and contradictions across your listings make you a risky answer, so you get left out.\n- **Reviews and reputation, read as evidence.** \"Best\" is a judgment, and the tools reach for proof. Volume and rating and recency of reviews are among the clearest signals of it.\n- **Structured, readable content.** Information laid out so a machine can parse it — clear service descriptions, real answers to real questions — is far more likely to be quoted back than marketing fluff.\n- **Corroboration across sources.** A business mentioned consistently across directories, its own site, and third-party pages reads as real and citable. One mentioned in only one place does not.\n\nNone of that is a trick. It is the same authority-building that has always won local search, now serving a second master.\n\n## What most businesses should do about it\n\nNothing panicked. This is not a reason to abandon Google — Google still drives the majority of local discovery, and the AI overview sits on top of the same signals. The move is to make sure the work you do to rank *also* makes you legible and citable to the AI tools: consistent listings, genuine reviews, content that answers questions in plain language, and structure a machine can read.\n\nDo that, and you show up in both places — the old search and the new one. Ignore it, and you slowly go invisible in a channel that is only growing, to an audience that skews toward exactly the customers worth having: the ones who research before they buy.\n\n## The honest state of it\n\nThis is early. The share of searches happening this way is real but not yet dominant, and the tools change monthly. Anyone who tells you they have it perfectly figured out is selling certainty that does not exist yet.\n\nBut the direction is not in doubt. The businesses that start building for it now — quietly, as part of the same visibility work they should already be doing — will be the names these tools have learned by the time it matters. I build for both the search that still goes to Google and the one that increasingly does not.",

      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "If a customer asks ChatGPT or Perplexity \"who should I call for [your service] near me,\" what determines whether your name comes up? Not magic, and not paid placement. The tools assemble an answer from what they can read about you — so the work is making yourself readable, credible, and corroborated. Here is what actually moves it, in the order I would tackle it.\n\n## Say plainly what you do, where, and for whom\n\nAI tools quote businesses whose basics are unambiguous. If a person cannot tell from your site in five seconds that you are a mercury-free dentist serving three specific towns, a machine cannot either. Spell it out in plain language — the service, the area, the specialty — in text, not buried in an image or a slogan. Vagueness gets you skipped, because a vague business is a risky answer.\n\n## Answer the actual questions people ask\n\nThe tools favor content that reads like an answer, because their job is to answer. A page that genuinely addresses *\"how much does X cost,\"* *\"is X safe,\"* *\"what's the difference between X and Y\"* is far more quotable than a page that lists services. Write the questions your customers actually ask, then answer them clearly. You are not writing for a search algorithm anymore. You are writing the source an AI will paraphrase.\n\n## Make your reputation legible\n\nWhen a tool is asked for the *best*, it looks for evidence of quality it can cite. Reviews are the most available proof — their number, their rating, how recent they are, and increasingly what they actually say. A business with many recent, specific reviews is a safer thing for an AI to recommend than one with six reviews from two years ago. This is where a review system stops being a nicety and becomes infrastructure.\n\n## Be corroborated, not just self-described\n\nAnyone can claim anything on their own website. What makes a claim trustworthy to these tools is agreement across sources — your site, your Google profile, directories, third-party mentions all saying the same consistent thing about who you are. Inconsistency (a different name here, a wrong category there, an old address somewhere) does not just hurt traditional SEO; it makes you a shaky answer the tool would rather not give.\n\n## Keep it current\n\nStale signals age out. A profile last touched two years ago, reviews that stopped in 2024, content that references last year — these tell both Google and the AI tools that the business may not even be active. Freshness is a trust signal. Steady, small updates beat a big push followed by silence.\n\n## The thing to understand underneath all of it\n\nNone of this is a separate discipline from good local SEO. It is the same authority-building — clarity, reputation, consistency, freshness — now read by a second kind of reader. That is genuinely good news: the work you do to be recommended by an AI is the same work that ranks you on Google. You are not choosing between the two. You are building one presence that serves both.\n\nWhere it goes next, nobody fully knows — the tools are months old and changing constantly. But the foundation is not speculative. Businesses that are clear, well-reviewed, consistent, and current are the ones getting named today, and they are building the head start that will be hard to catch later.",

      "author": "Francis John",
      "excerpt": "It is an uncomfortable truth: the better business often loses to the one with more reviews. Not because customers are foolish — because it is the only evidence they have.",

      "externalLabel": "Google Business Profile Help — reviews",
      "externalUrl": "https://support.google.com/business/answer/3474122",
      "body": "Here is a thing that is hard to accept if you run a genuinely excellent local business: the quality of your work is nearly invisible to the person deciding whether to hire you.\n\nThey have not experienced your work yet — that is the whole point, they are deciding whether to. They cannot see your craftsmanship, your reliability, the way you clean up after yourself. All they can see, at the moment of choosing, is the evidence available online. And the most available evidence, by far, is reviews.\n\nSo a business with ninety-six recent five-star reviews beats a business with eleven, even when the second one does better work. Not because the customer is lazy or foolish. Because reviews are the only proof they have, and one business handed them a mountain of it while the other handed them a molehill.\n\n## Reviews are doing two jobs at once\n\nThis is what makes reviews uniquely powerful, and uniquely costly to neglect. They work on two fronts simultaneously:\n\n**They move rankings.** Review volume, rating, and recency are among the signals Google weighs for the map pack. More good reviews, arriving steadily, help you show up in the first place.\n\n**They win the decision.** Once you show up, reviews are what convert the searcher into a caller. The ranking gets you seen; the reviews get you chosen.\n\nA business weak on reviews loses twice — it ranks lower *and* converts worse among the few who find it. A business strong on reviews wins twice. That compounding is why the gap between the review-rich and the review-poor widens every month rather than staying steady.\n\n## Why good businesses end up review-poor\n\nIt is almost never because customers are unhappy. It is because asking is awkward and easy to forget. The job ends, everyone moves on, and the happy customer — who would gladly have left five stars — is never asked. Multiply that by every job for a year and you have an excellent business with a thin, stale review profile losing to a mediocre one that simply remembered to ask.\n\nThe unhappy customers, meanwhile, never need reminding. They arrive at your review page on their own. So a business that does not actively gather reviews ends up with a profile skewed toward its worst days — the opposite of the truth.\n\n## What actually fixes it\n\nThe fix is not complicated, but it has to be systematic, because \"remember to ask\" does not survive a busy week. It means a reliable prompt after every completed job — while satisfaction is highest — that makes leaving a review effortless. Done consistently, it does two things: it closes the volume gap with your competitors, and it shifts your profile toward the truth of your work rather than the loud minority.\n\nIt should also, quietly, catch the unhappy customer *before* they post — routing that person to you privately to make it right, instead of to a public one-star. Not to hide anything, but because one bad afternoon should be a conversation, not a permanent scar.\n\nThat is the entire premise of the reputation engine I build for clients. Reviews are too important to leave to whether someone remembered to ask. The better business should win — but it only wins if the evidence of that is in front of the customer at the moment they decide. Getting it there is a system, not a hope.",

      "author": "Francis John",
      "excerpt": "Every marketing dollar chases a new customer. Almost none goes to the one who already hired you — who is cheaper to win back and worth more over time.",

      "externalLabel": "Google Business Profile Help",
      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "Almost all local marketing points in one direction: outward, at strangers. Get found, get chosen, win the new customer. It is where the attention goes, where the budget goes, and where nearly every article — including several of mine — spends its time.\n\nBut there is a customer being ignored in all of that, and it is the most valuable one you have: the person who already hired you once.\n\n## The math nobody runs\n\nWinning a new customer costs money. You paid to be found, paid to be chosen, and gave up margin on the first job earning their trust. That cost is spent whether they ever come back or not.\n\nThe customer who already hired you costs almost nothing to reach again. They know you. They already trust you — the expensive part is done. And across their lifetime they are worth a multiple of that first job, if there is a second and a third.\n\nYet most local businesses spend everything acquiring and nothing retaining. They pour money into the top of the funnel and let the bottom leak, then wonder why growth feels like running to stand still. It feels that way because it is: every new customer is quietly replacing one that drifted away unnoticed.\n\n## Why retention gets ignored\n\nPartly because it is invisible. A customer who does not come back does not complain — they just do not return, and you never see the loss. A slow leak makes no sound. Acquisition, by contrast, is visible and satisfying: a new call, a new job, a number that went up.\n\nAnd partly because retention is unglamorous. It is follow-up, reminders, staying in touch — nothing that feels like marketing. So it does not get built, and the customer you already paid for slowly forgets you and hires whoever they find next time, which may not be you.\n\n## What retention actually looks like for a local business\n\nIt is not a loyalty-points app. For most local service businesses it is simpler and more human:\n\n- **A reason and a way to come back.** A seasonal reminder, a maintenance nudge, a check-in at the interval your service naturally repeats on. The customer often *wants* to return and simply forgot — the reminder is the whole product.\n- **Staying in front of them between jobs.** A light, genuinely useful presence — email, the occasional message — so that when the need returns, you are the name in mind, not a search they run again from scratch.\n- **Knowing who is drifting.** Some sense of who has not been back in a while, so a lapsing customer is a person you can re-engage rather than a number you never notice leaving.\n\nNone of that is expensive. It is just built, or not built — and for most businesses it is not.\n\n## The point\n\nYou spend the most to win a customer and the least to keep one, which is exactly backwards from where the value is. Retention is the fourth engine for a reason: getting found and getting chosen win the customer once, but keeping them is what turns a business from a treadmill of new jobs into something that compounds.\n\nThe cheapest, warmest, most likely-to-say-yes customer you will ever market to is the one who already hired you. Most businesses never send them a single word after the invoice. That is the gap — and it is one of the easiest to close.",
