      "body": "There are two ways to put me to work for your business. Same person, same systems — but two very different arrangements, and the right one depends entirely on where your business is. Here's the honest breakdown of each, and when I'd point you toward one over the other.\n\n## Option one: partner with me on contract\n\nThis is a partnership. You deliver your service; I run the marketing that keeps the right customers finding you. We marry the two — your craft and my systems — so you can serve more people without building a marketing team to do it.\n\nWhat it looks like in practice: I own the visibility, the reputation, and the copy that turns attention into booked work. You stay focused on the thing you're actually great at. The arrangement flexes — we scale it up as you grow, dial it back when you need to, without the fixed weight of a salary.\n\n**The benefits:**\n\n- **Reach without overhead.** You get a full marketing system without hiring, training, or carrying a full-time person.\n- **You do what you're best at.** Your energy stays on your service and your customers, not on learning marketing.\n- **Flexibility.** Contract scales with your business. A busy season and a slow one don't cost you the same.\n- **The person who built it runs it.** You're not handing work to a junior hire — you get me, directly.\n\n**Best when:** you want serious reach and results, but marketing isn't a big enough or steady enough job to justify a full-time salary — or you'd simply rather keep your focus on delivering your service and let a partner handle being found.\n\n## Option two: hire me in-house\n\nHere I join your team and own marketing from the inside. Not a vendor you check in with — a member of the business, in the room, focused on one company: yours.\n\nWhat it looks like: daily, deep focus on a single business. I'm in the meetings, I hear the customer complaints firsthand, I catch the things nobody writes down. The knowledge I build about your business stays in your building.\n\n**The benefits:**\n\n- **Total focus.** One business gets my full attention, every day.\n- **In the room.** I'm part of the decisions as they happen, not reacting from outside.\n- **Knowledge that stays.** Everything I learn about your customers and your market lives inside your company.\n- **Speed.** Constant small decisions get made fast when the person owning marketing is on the team.\n\n**Best when:** marketing is a genuine full-time, permanent function for your business — enough consistent work to fill a real role, and a need for that person to be embedded in the day-to-day.\n\n## How to choose\n\nThe honest test is workload and permanence. If marketing is a steady, full-time, forever part of your business, hiring in-house wins — an embedded person who lives your business beats an outside partner for that. If the work is real but not full-time, or you'd rather stay focused on your service and let someone else own being found, the contract partnership is the better fit — you get the reach without the fixed cost.\n\nEither way, you're working with the person who builds the systems, not an agency reselling someone else's. If you're not sure which fits, that's worth a conversation — tell me about your business and I'll tell you honestly which way I'd go.",

      "slug": "the-search-that-no-longer-goes-to-google",
      "title": "The search that no longer goes to Google",
      "date": "2026-08-06",
      "status": "published",
      "author": "Francis John",
      "excerpt": "A growing share of your customers have stopped searching Google first. They ask an AI which business to call — and it answers with names. Is yours one of them?",
      "cover": "",

      "externalLabel": "Google Business Profile Help",
      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "Something changed in the last two years, quietly, and most local businesses have not noticed because it does not show up in the reports they are used to reading.\n\nA meaningful and growing share of people no longer open Google, scroll the map pack, and compare listings. They open ChatGPT, or Perplexity, or they read Google's own AI summary at the top of the page, and they ask a question: *\"who's the best plumber near me?\"* — and the tool answers. Not with ten blue links. With a short list of names, sometimes just one.\n\nIf your business is not one of the names, you were never in the running. The customer never saw a list to scroll. They got an answer, and it was not you.\n\n## Why this is different from regular search\n\nFor twenty years, local search worked one way: rank high enough to be seen, and you had a shot. The customer did the comparing.\n\nAI search removes the comparing. The tool does it, invisibly, and hands the customer a conclusion. That is a profound shift, because there is no page two to fight your way onto and no map pack to crack — there is the answer, and everything else. Being *findable* is no longer the goal. Being *the answer* is.\n\n## How an AI decides who to name\n\nThese tools do not pull names from nowhere. They assemble an answer from what they can read about a business across the web — and the signals they weigh overlap heavily with good local SEO, which is the good news for anyone who has done the work:\n\n- **A complete, consistent presence.** The tool needs to understand clearly what you do, where, and for whom. Gaps and contradictions across your listings make you a risky answer, so you get left out.\n- **Reviews and reputation, read as evidence.** \"Best\" is a judgment, and the tools reach for proof. Volume and rating and recency of reviews are among the clearest signals of it.\n- **Structured, readable content.** Information laid out so a machine can parse it — clear service descriptions, real answers to real questions — is far more likely to be quoted back than marketing fluff.\n- **Corroboration across sources.** A business mentioned consistently across directories, its own site, and third-party pages reads as real and citable. One mentioned in only one place does not.\n\nNone of that is a trick. It is the same authority-building that has always won local search, now serving a second master.\n\n## What most businesses should do about it\n\nNothing panicked. This is not a reason to abandon Google — Google still drives the majority of local discovery, and the AI overview sits on top of the same signals. The move is to make sure the work you do to rank *also* makes you legible and citable to the AI tools: consistent listings, genuine reviews, content that answers questions in plain language, and structure a machine can read.\n\nDo that, and you show up in both places — the old search and the new one. Ignore it, and you slowly go invisible in a channel that is only growing, to an audience that skews toward exactly the customers worth having: the ones who research before they buy.\n\n## The honest state of it\n\nThis is early. The share of searches happening this way is real but not yet dominant, and the tools change monthly. Anyone who tells you they have it perfectly figured out is selling certainty that does not exist yet.\n\nBut the direction is not in doubt. The businesses that start building for it now — quietly, as part of the same visibility work they should already be doing — will be the names these tools have learned by the time it matters. I build for both the search that still goes to Google and the one that increasingly does not.",

      "excerpt": "If customers now ask AI tools which local business to call, the practical question is what makes one get named. Here is what actually moves it.",

      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "If a customer asks ChatGPT or Perplexity \"who should I call for [your service] near me,\" what determines whether your name comes up? Not magic, and not paid placement. The tools assemble an answer from what they can read about you — so the work is making yourself readable, credible, and corroborated. Here is what actually moves it, in the order I would tackle it.\n\n## Say plainly what you do, where, and for whom\n\nAI tools quote businesses whose basics are unambiguous. If a person cannot tell from your site in five seconds that you are a mercury-free dentist serving three specific towns, a machine cannot either. Spell it out in plain language — the service, the area, the specialty — in text, not buried in an image or a slogan. Vagueness gets you skipped, because a vague business is a risky answer.\n\n## Answer the actual questions people ask\n\nThe tools favor content that reads like an answer, because their job is to answer. A page that genuinely addresses *\"how much does X cost,\"* *\"is X safe,\"* *\"what's the difference between X and Y\"* is far more quotable than a page that lists services. Write the questions your customers actually ask, then answer them clearly. You are not writing for a search algorithm anymore. You are writing the source an AI will paraphrase.\n\n## Make your reputation legible\n\nWhen a tool is asked for the *best*, it looks for evidence of quality it can cite. Reviews are the most available proof — their number, their rating, how recent they are, and increasingly what they actually say. A business with many recent, specific reviews is a safer thing for an AI to recommend than one with six reviews from two years ago. This is where a review system stops being a nicety and becomes infrastructure.\n\n## Be corroborated, not just self-described\n\nAnyone can claim anything on their own website. What makes a claim trustworthy to these tools is agreement across sources — your site, your Google profile, directories, third-party mentions all saying the same consistent thing about who you are. Inconsistency (a different name here, a wrong category there, an old address somewhere) does not just hurt traditional SEO; it makes you a shaky answer the tool would rather not give.\n\n## Keep it current\n\nStale signals age out. A profile last touched two years ago, reviews that stopped in 2024, content that references last year — these tell both Google and the AI tools that the business may not even be active. Freshness is a trust signal. Steady, small updates beat a big push followed by silence.\n\n## The thing to understand underneath all of it\n\nNone of this is a separate discipline from good local SEO. It is the same authority-building — clarity, reputation, consistency, freshness — now read by a second kind of reader. That is genuinely good news: the work you do to be recommended by an AI is the same work that ranks you on Google. You are not choosing between the two. You are building one presence that serves both.\n\nWhere it goes next, nobody fully knows — the tools are months old and changing constantly. But the foundation is not speculative. Businesses that are clear, well-reviewed, consistent, and current are the ones getting named today, and they are building the head start that will be hard to catch later.",

      "status": "published",
      "author": "Francis John",
      "excerpt": "It is an uncomfortable truth: the better business often loses to the one with more reviews. Not because customers are foolish — because it is the only evidence they have.",
      "cover": "",

      "externalLabel": "Google Business Profile Help — reviews",
      "externalUrl": "https://support.google.com/business/answer/3474122",
      "body": "Here is a thing that is hard to accept if you run a genuinely excellent local business: the quality of your work is nearly invisible to the person deciding whether to hire you.\n\nThey have not experienced your work yet — that is the whole point, they are deciding whether to. They cannot see your craftsmanship, your reliability, the way you clean up after yourself. All they can see, at the moment of choosing, is the evidence available online. And the most available evidence, by far, is reviews.\n\nSo a business with ninety-six recent five-star reviews beats a business with eleven, even when the second one does better work. Not because the customer is lazy or foolish. Because reviews are the only proof they have, and one business handed them a mountain of it while the other handed them a molehill.\n\n## Reviews are doing two jobs at once\n\nThis is what makes reviews uniquely powerful, and uniquely costly to neglect. They work on two fronts simultaneously:\n\n**They move rankings.** Review volume, rating, and recency are among the signals Google weighs for the map pack. More good reviews, arriving steadily, help you show up in the first place.\n\n**They win the decision.** Once you show up, reviews are what convert the searcher into a caller. The ranking gets you seen; the reviews get you chosen.\n\nA business weak on reviews loses twice — it ranks lower *and* converts worse among the few who find it. A business strong on reviews wins twice. That compounding is why the gap between the review-rich and the review-poor widens every month rather than staying steady.\n\n## Why good businesses end up review-poor\n\nIt is almost never because customers are unhappy. It is because asking is awkward and easy to forget. The job ends, everyone moves on, and the happy customer — who would gladly have left five stars — is never asked. Multiply that by every job for a year and you have an excellent business with a thin, stale review profile losing to a mediocre one that simply remembered to ask.\n\nThe unhappy customers, meanwhile, never need reminding. They arrive at your review page on their own. So a business that does not actively gather reviews ends up with a profile skewed toward its worst days — the opposite of the truth.\n\n## What actually fixes it\n\nThe fix is not complicated, but it has to be systematic, because \"remember to ask\" does not survive a busy week. It means a reliable prompt after every completed job — while satisfaction is highest — that makes leaving a review effortless. Done consistently, it does two things: it closes the volume gap with your competitors, and it shifts your profile toward the truth of your work rather than the loud minority.\n\nIt should also, quietly, catch the unhappy customer *before* they post — routing that person to you privately to make it right, instead of to a public one-star. Not to hide anything, but because one bad afternoon should be a conversation, not a permanent scar.\n\nThat is the entire premise of the reputation engine I build for clients. Reviews are too important to leave to whether someone remembered to ask. The better business should win — but it only wins if the evidence of that is in front of the customer at the moment they decide. Getting it there is a system, not a hope.",

      "status": "published",
      "author": "Francis John",
      "excerpt": "Every marketing dollar chases a new customer. Almost none goes to the one who already hired you — who is cheaper to win back and worth more over time.",

      "externalLabel": "Google Business Profile Help",
      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "Almost all local marketing points in one direction: outward, at strangers. Get found, get chosen, win the new customer. It is where the attention goes, where the budget goes, and where nearly every article — including several of mine — spends its time.\n\nBut there is a customer being ignored in all of that, and it is the most valuable one you have: the person who already hired you once.\n\n## The math nobody runs\n\nWinning a new customer costs money. You paid to be found, paid to be chosen, and gave up margin on the first job earning their trust. That cost is spent whether they ever come back or not.\n\nThe customer who already hired you costs almost nothing to reach again. They know you. They already trust you — the expensive part is done. And across their lifetime they are worth a multiple of that first job, if there is a second and a third.\n\nYet most local businesses spend everything acquiring and nothing retaining. They pour money into the top of the funnel and let the bottom leak, then wonder why growth feels like running to stand still. It feels that way because it is: every new customer is quietly replacing one that drifted away unnoticed.\n\n## Why retention gets ignored\n\nPartly because it is invisible. A customer who does not come back does not complain — they just do not return, and you never see the loss. A slow leak makes no sound. Acquisition, by contrast, is visible and satisfying: a new call, a new job, a number that went up.\n\nAnd partly because retention is unglamorous. It is follow-up, reminders, staying in touch — nothing that feels like marketing. So it does not get built, and the customer you already paid for slowly forgets you and hires whoever they find next time, which may not be you.\n\n## What retention actually looks like for a local business\n\nIt is not a loyalty-points app. For most local service businesses it is simpler and more human:\n\n- **A reason and a way to come back.** A seasonal reminder, a maintenance nudge, a check-in at the interval your service naturally repeats on. The customer often *wants* to return and simply forgot — the reminder is the whole product.\n- **Staying in front of them between jobs.** A light, genuinely useful presence — email, the occasional message — so that when the need returns, you are the name in mind, not a search they run again from scratch.\n- **Knowing who is drifting.** Some sense of who has not been back in a while, so a lapsing customer is a person you can re-engage rather than a number you never notice leaving.\n\nNone of that is expensive. It is just built, or not built — and for most businesses it is not.\n\n## The point\n\nYou spend the most to win a customer and the least to keep one, which is exactly backwards from where the value is. Retention is the fourth engine for a reason: getting found and getting chosen win the customer once, but keeping them is what turns a business from a treadmill of new jobs into something that compounds.\n\nThe cheapest, warmest, most likely-to-say-yes customer you will ever market to is the one who already hired you. Most businesses never send them a single word after the invoice. That is the gap — and it is one of the easiest to close.",

      "body": "Biological dentistry has a marketing problem most practices never solve, and it is not the one they think.\n\nThe problem is not that people do not want the service. The health-conscious patient is one of the most motivated buyers in all of healthcare — they research for weeks, they will drive two hours, and they have already decided they want mercury-free, biocompatible, whole-body-focused care before they ever open Google. The demand is there and it is intense.\n\nThe problem is that when that patient searches, the practice offering exactly what they want does not appear.\n\n## The language gap\n\nHere is the mechanism, and it is worth understanding because it is invisible from inside the practice.\n\nA general dental marketing agency optimizes for \"dentist near me.\" It is the highest-volume dental search, so it looks like the right target. But the biological patient is not typing that. They are typing \"mercury-free dentist,\" \"SMART amalgam removal,\" \"ceramic implant dentist,\" \"ozone therapy,\" \"biological dentistry near me.\"\n\nThose are different searches, and Google treats them differently. A practice optimized for the generic term is invisible for the specific one — which means the practice is invisible to precisely the patient who most wants it. The patient searching \"safe amalgam removal\" and the practice offering it are in the same town and never meet, because the website and the Google profile do not speak the patient's language back to them.\n\nThat is the whole failure. Not effort, not quality of care. Language.\n\n## Why a generalist cannot fix it\n\nYou cannot optimize for terms you do not understand. An agency that does not know SMART protocol from a SOAP note, or why IAOMT accreditation matters to a patient, cannot build the content and the profile signals that tell Google — and increasingly the AI search tools — that this practice is the real thing rather than a conventional office claiming holistic on the side.\n\nThe patient can tell the difference. So can Google, if the signals are built correctly. Building those signals requires knowing the field, not just knowing marketing.\n\n## The newer problem: AI search\n\nThere is a second shift underway that most practices have not felt yet. A growing share of health-conscious patients no longer start at Google — they ask ChatGPT, Perplexity, or Google's AI overviews: *\"who's a good biological dentist near me?\"* Those tools answer with specific practices. If a practice is not structured to be surfaced by them, it is invisible in a channel that is only going to grow — and the research-driven wellness patient is exactly the kind of person adopting these tools first.\n\n## What this actually takes\n\nGetting a biological practice found is not general dental marketing turned up louder. It is a specialized job: a Google profile built with holistic-specific categories, local SEO targeting the exact terms these patients search, citations on health-aligned directories patients actually trust, content that signals genuine biological expertise, and structure that makes AI tools name the practice. Then the reputation system that a research-driven patient demands before booking, and a site that converts them once they arrive.\n\nI do this work for biological and holistic practices specifically — it is one of the few niches I specialize in, and I run the nationwide directory these patients use to find care, so I know exactly how they search and what makes them book.\n\n**The full breakdown — the four bottlenecks keeping patients out, and how each gets fixed — is here: [Holistic Dental Marketing](https://holisticdentalcare.netlify.app/holistic-dental-marketing/).**",

      "externalLabel": "Marketing for Home Watch companies — the full picture",
      "externalUrl": "https://homewatchos.com/marketing/",
      "body": "Home watch is one of the purest trust businesses there is. A homeowner hands you the keys to an empty property and drives away for months. Everything about winning that client happens before you ever speak — and that is exactly why the revenue leaks so quietly.\n\nYou never see the client you lost. There is no rejection, no lost bid you can point to. There is just a homeowner three miles away who searched \"home watch company near me,\" found someone else, and hired them. You will never know it happened. That is what makes the problem so hard to fix from inside the business: it is invisible.\n\n## Where the leaks are\n\nThere are four of them, and they compound.\n\n**Visibility.** When a homeowner in your market searches, do you appear? For most home watch companies the answer is no, or barely — and the competitors ranking above you get the call, whether or not their work is as good as yours. In a business decided by a search, ranking is not vanity. It is the whole funnel.\n\n**Reputation.** A company with four reviews and a 4.2 average loses to one with forty-seven and a 4.9 — even when the work is identical. The homeowner deciding whether to trust you with their empty house is one of the most cautious buyers there is, and reviews are the proof they look for. Without a system to build them, you fall further behind every single month.\n\n**Authority.** This is what makes a homeowner choose you *before* the first conversation — content, consistency, a credible presence, certifications shown where people look. Most home watch companies have almost none of it online, which means every prospect starts from zero trust.\n\n**Retention.** Losing one $249-a-month client is nearly three thousand dollars a year gone. Most operators do not know their churn rate, have no system to catch a client drifting, and find out someone left only when the payment stops.\n\n## Why you cannot see it yourself\n\nEvery one of those leaks is silent. No angry call, no visible loss — just a slow drift of homeowners choosing someone easier to find and easier to trust. From inside the business, everything looks fine right up until growth stalls and nobody can say why.\n\nThat is the real problem with home watch marketing. Not that these businesses do bad work — they often do excellent work. It is that the quality is invisible to the people deciding whether to hire them, and the losses never announce themselves.\n\n## What fixes it\n\nThe fix is the same shape as the problem: a system across all four — visibility so you are found, reputation so you are trusted, authority so you are chosen before the call, and retention so the clients you win stay. Managed steadily, in the background, while you do the actual work of watching homes.\n\nThis is a niche I build for specifically. The full picture — how the four leaks work and how each one gets sealed — lives here:\n\n**[Marketing for Home Watch companies](https://homewatchos.com/marketing/).**",

      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "Most marketers will take any client with a pulse and a budget. I understand why — work is work. But I have found that trying to serve everyone is exactly why so much local marketing is mediocre. You cannot know a market you only visit occasionally.\n\nSo I stay narrow on purpose. Here is who I build visibility systems for, and why the focus makes the work better.\n\n## Home service businesses\n\nThe trades that live or die by *\"[service] near me.\"* Plumbers, HVAC, electricians, roofers, landscapers, cleaners, painters, pest control, contractors of every kind.\n\nThese businesses share a single decisive moment: a customer with a problem opens Google, searches, and calls one of the first names they trust. Everything I do is built around winning that moment — showing up in the map pack, having the reviews that earn the click, and a site that turns the click into a booked job. The skill of the business barely matters if it is invisible when that search happens.\n\n## Home Watch services\n\nA newer niche, and one I have come to specialize in: businesses that check on properties while owners are away. Snowbirds, second homes, seasonal residents.\n\nIt is a trust-first business — someone is handing over the keys to their home — which makes reputation and visibility unusually important. Being found by the right homeowner, and looking unmistakably credible when they find you, is most of the battle. It rewards exactly the kind of system I build.\n\n## Specialized health practices\n\nThis is where the work gets most focused. I work with a small number of specialized practices — **biological and holistic dentists, upper cervical doctors, and adjacent specialty health services.**\n\nThese are not general dental offices or chiropractors. They are practitioners of specific, less-common disciplines whose ideal patients are actively searching for that exact specialty — often willing to travel for it. That changes the whole marketing problem. It is less about dominating a single town and more about being *the* findable authority for a specific practice type across a wider area. Patients searching for a biological dentist or an upper cervical doctor know precisely what they want; the job is making sure the practice is what they find.\n\nBecause these fields are specialized, the competition for search visibility is thinner and the reward for getting it right is larger. One well-built practice can own its discipline in its region.\n\n## Why narrow is better for you\n\nHere is the honest case for specialization, from the client's side:\n\n**I know your searches.** I know what your customers actually type, because I have watched it across businesses like yours. A generalist is guessing.\n\n**I know your competitors.** I have seen who wins these markets and how. That is worth more than any tactic.\n\n**I am not learning on your dime.** A marketer who takes every industry learns each one on the client who hired them. Staying narrow means I already know yours.\n\nA generalist agency spreads itself across every business type and masters none. I went the other way. If you are a home service business, a Home Watch operator, or a specialized health practice, that focus is working in your favor.\n\nIf you are not — I will tell you honestly that you would be better served by someone who specializes in what you do. That is the whole point of staying narrow.",

      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "A business owner asked me last month to \"just take a look\" at why his phone had gone quiet. Free, of course — everyone does the free look. I used to.\n\nHere is what the free look actually is: an hour of the most valuable work I do, given away, so I can then sell the owner a guess about what to buy. That is backwards. The looking *is* the product. The doing comes after, and only if the looking says it should.\n\nSo I stopped giving it away. I now sell a **Local Visibility Diagnostic** — a fixed fee, a written report, a clear answer. Here is the thinking, because the reasoning is the same reasoning I bring to a client's business.\n\n## Buying marketing blind is the expensive part\n\nMost local businesses buy marketing the way you would buy medicine without seeing a doctor — by guessing, or by trusting whoever sold the hardest. They end up on a monthly plan when they needed a one-time fix, or in a big package when the entry tier would have done it, or paying for reach when the actual problem was that their reviews scared people off.\n\nThe wrong structure is not a small mistake. It is thousands of dollars aimed at the wrong target, for months, before anyone notices.\n\nAgainst that, a few hundred dollars to know *exactly* what is broken — before you spend the thousands — is the cheapest decision in the whole process. That is the pitch, and it is true.\n\n## What the diagnosis actually finds\n\nThere are only a few ways a local business loses revenue, and they need different fixes:\n\n- **Nobody finds you.** You are outside the map pack for the searches that matter. A visibility problem.\n- **They find you and do not trust you.** Thin reviews, old reviews, a rating below the competitor's. A reputation problem.\n- **They trust you and do not call.** A site that describes the business instead of making it easy to book. A conversion problem.\n- **They call once and never return.** No follow-up, no reason to come back. A retention problem.\n\nEach of those has a different fix, a different cost, and a different urgency. Diagnosing which one you are actually looking at is a skill, not a guess — and it is worth paying for on its own.\n\n## The part that makes it honest\n\nIf you engage me for the work the diagnosis points to, the fee comes off the cost. So if the answer is \"a project\" or \"ongoing help,\" you have lost nothing — the diagnostic paid for your setup.\n\nAnd if the honest answer is *\"do not spend money on this yet\"* — you are not returning calls, or the business itself has a problem no amount of marketing will fix — I tell you that, and why. You paid for clarity. Clarity that saves you from spending is worth more than clarity that spends.\n\nThat is the test of whether a diagnosis is worth charging for: it has to be valuable even when the answer is *don't hire me*. Mine is.\n\n## Why this is better for both of us\n\nFor the business owner, it replaces a sales pitch with a diagnosis. You stop being sold to and start being told the truth, in writing, that you can act on with me or with anyone.\n\nFor me, it means the people I work with have already decided they are serious. Nobody pays for a diagnostic to kick tires. And I get paid for the thinking, instead of giving the thinking away and hoping it converts.\n\nThe free look trains owners to believe the thinking is worthless. It is not. It is the most valuable thing I do.",

      "externalUrl": "https://support.google.com/business/answer/9157481",
      "body": "Adding a county to your service area feels like covering more ground. It does the opposite.\n\nOpen Google Maps and search anything local. Counties do not appear unless you go looking for them. Towns and cities do, and the more important the place, the bolder the label. That bolding is the signal worth following.\n\n## The method\n\n1. Enter your business address exactly as it appears on your Google Business Profile.\n2. Zoom to roughly a ten-mile radius.\n3. Read the bolded town and city names inside ten to fifteen miles.\n4. Add ten to twenty of the boldest to your service area.\n\n## Why bolder is better\n\nMap labels are weighted by how significant a place is. A bold name is a place with search volume behind it. A faint one is a place with a handful of monthly searches and a long drive attached.\n\n## What to skip\n\nSkip counties. Skip the towns you would grudgingly drive to. A service area is a claim about where you actually work, and an honest one performs better than an ambitious one.",

      "body": "A business owner who is tired of doing their own marketing usually asks the wrong question first. The question is not *should I hire someone or bring in an agency*. It is *is this work a project or a function*.\n\nA project has an end. A function does not.\n\n## The three tests\n\n**Is the workload steady?** If marketing needs forty hours every week, month after month, that is a job. If it is fifteen hours some weeks and none in others, an employee spends the quiet weeks looking for something to do, and you pay for it.\n\n**How specialised is the need?** Local SEO, review systems, paid media and content are four different skills. One person who is genuinely strong at all four is expensive and rare. A contract arrangement lets you buy the specific skill for the specific stretch.\n\n**Does the knowledge need to live inside the building?** Some of it does. Nobody outside your company will ever understand your customers the way your service manager does. If the work depends on that, it belongs inside.\n\n## When in-house genuinely wins\n\nI say this as someone who takes contract work.\n\n- **Volume justifies it.** Past roughly thirty consistent hours a week, an employee costs less per hour than any contractor.\n- **The work needs the room.** Someone in the meetings, hearing the complaints, catching the thing nobody wrote down.\n- **You want the knowledge to stay.** An employee builds understanding of your business that walks out the door with a contractor.\n- **Speed matters daily.** Constant small decisions are faster from someone two desks away.\n\n## When contract wins\n\n- **You do not yet know what you need.** Diagnosing it is a project, and it should not cost you a salary.\n- **The need is deep but short.** Rebuilding a site architecture is three months of work, not a career.\n- **The volume is real but modest.** Fifteen hours a week of genuine work does not justify a full role.\n- **You have been burned.** A bad hire at a ten-person company is far more expensive than a bad contract.\n\n## The honest answer\n\nMost local service businesses under about twenty employees do not have forty hours a week of marketing work. They have ten to fifteen hours of the right work and thirty hours of activity that feels productive.\n\nHiring a full-time person to fill that gap does not fix it. It funds it.\n\nWork out what the real ten hours are first. That answer usually decides the rest.",

      "body": "When an owner tells me they are considering a marketing hire at sixty thousand, they are almost always describing the salary and nothing else.\n\n## What sits on top of salary\n\nThe Bureau of Labor Statistics tracks what employers actually spend per hour worked. Wages are roughly seventy percent of it. The rest is benefits and required contributions — the employer share of Social Security and Medicare, unemployment insurance, workers compensation, and whatever health coverage and paid leave you offer.\n\nCall it a third on top, before anything else.\n\n## What sits on top of that\n\n**Tools.** An SEO platform, a scheduler, an email system, design software, a reporting tool. A few hundred a month, and the employee will ask for them because they cannot do the job without them.\n\n**Ramp time.** A marketer does not produce in month one. They learn the business, the customers, the systems. Three months at partial output is realistic, and you pay full cost for all of it.\n\n**Management.** Somebody supervises this person. If that is you, and you do not know the work well enough to judge it, you now have a second problem: you cannot tell good from busy.\n\n## The number nobody budgets for\n\nThe cost of the wrong hire.\n\nAt a company of eight people, one bad hire is twelve percent of the workforce. The damage is not just salary — it is the months before you admit it is not working, the recruiting time, the second search, and the marketing that stood still throughout.\n\nMost owners discover a mismatch somewhere between months four and seven. By then the true cost is well past the salary line in the budget.\n\n## The comparison people skip\n\nTake the fully loaded annual figure and divide by the hours of *useful* work you expect. Not hours present. Hours that move something.\n\nThen compare that hourly number to a contract rate for the same work.\n\nContract rates look expensive per hour and often are not, because you buy only the productive hours. There is no ramp period, no idle Tuesday, no tools line item.\n\n## Where the arithmetic flips\n\nAbove roughly thirty consistent, genuinely productive hours a week, employment wins clearly. That is not close.\n\nThe question is whether you have thirty such hours, or whether you have twelve and are trying to build a job around them.",

    {
      "slug": "the-eighteen-month-problem-with-in-house-marketing",
      "title": "The eighteen-month problem with in-house marketing hires",
      "date": "2026-08-18",
      "status": "draft",
      "author": "Francis John",
      "excerpt": "The needs of a growing business change faster than one person's skill set. That mismatch shows up around month eighteen, and it is nobody's fault.",
      "cover": "",
      "tags": [
        "Hiring",
        "Marketing Ops"
      ],
      "projectSlug": "revenueiq",
      "externalLabel": "SBA — hire and manage employees",
      "externalUrl": "https://www.sba.gov/business-guide/manage-your-business/hire-manage-employees",
      "body": "A local business hires a marketing generalist. The first year goes well. Somewhere around month eighteen it stops going well, and everyone assumes the hire was wrong.\n\nUsually the hire was fine. The role changed underneath them.\n\n## How it unfolds\n\n**Months one to six — visibility.** Nothing is set up properly. The Google Business Profile is thin, the site has no structure, listings are inconsistent. This is local SEO work, and a generalist can make real progress.\n\n**Months seven to twelve — reputation.** Now people are finding the business, and the reviews are thin or old. Different job. Different skill. Systems, timing, follow-up, the awkward business of asking.\n\n**Months thirteen to eighteen — content and authority.** Visibility and trust both need feeding. That means writing, consistently, about things customers actually search for. This is the point where most generalists slow down, because writing well is a specialism and not everyone has it.\n\n**Month nineteen onward — retention.** The expensive part of acquiring a customer is already paid. Now the question is whether they come back. Email, re-engagement, lifecycle. Different skill again.\n\nFour phases, four skill sets, one person hired against the first one.\n\n## Why this is not a hiring failure\n\nYou hired for the problem you had. The problem moved because the hire worked.\n\nThe interview tested for the visibility phase because that was the fire. Eighteen months later you need a writer and a systems thinker, and you have someone strong at profile optimisation who is being asked to do something else.\n\n## Three ways out\n\n**Hire for the arc, not the fire.** Ask candidates how they would handle month eighteen. The answers separate people quickly.\n\n**Define the role as coordination.** Someone who owns the outcome and brings in specialists per phase. Rarer, more valuable, and worth paying for.\n\n**Split it.** One person inside who owns the relationship and the knowledge, specialists outside for each phase. More moving parts, and it matches how the work actually behaves.\n\n## The underlying point\n\nMarketing for a local service business is not one job. It is four, arriving in sequence.\n\nStructure the role around that and it holds. Structure it around whatever is on fire this quarter and you will be having an uncomfortable conversation in eighteen months.",

      "slug": "your-first-marketing-hire-should-not-be-a-generalist",
      "title": "Why your first marketing hire should not be a generalist",
      "date": "2026-08-25",
      "status": "draft",
      "author": "Francis John",
      "excerpt": "The generalist gets hired because the owner does not know what they need yet. But working that out is the actual first job, and it is not a full-time one.",
      "cover": "",
      "tags": [
        "Hiring",
        "Marketing Ops"
      ],
      "projectSlug": "revenueiq",
      "externalLabel": "Google Search Central — SEO starter guide",
      "externalUrl": "https://developers.google.com/search/docs/fundamentals/seo-starter-guide",
      "body": "The job posting says *marketing coordinator* and lists eleven responsibilities across five disciplines. It is honest about one thing: the business does not know what it needs.\n\nHiring a generalist is a reasonable response to that uncertainty. It is also the expensive one.\n\n## The diagnosis is the first job\n\nBefore anyone should be running campaigns, someone has to answer a narrow question: *where is this business actually losing revenue?*\n\nThere are only a few possible answers.\n\n- **Nobody finds you.** Weak local search presence, thin Google Business Profile, no map pack presence.\n- **They find you and do not trust you.** Nine reviews, most of them old.\n- **They trust you and do not call.** A site that describes the business instead of making it easy to book.\n- **They call once and never return.** No follow-up, no reason to come back.\n\nEach of those has a different fix, a different cost, and a different urgency. They are not solved by the same person or in the same order.\n\n## Why a generalist struggles with this\n\nDiagnosis is a senior skill. It requires having seen the four failures often enough to recognise which one you are looking at.\n\nA generalist hired early is usually not senior, because a senior generalist is expensive and rarely wants the role. So the diagnosis gets skipped, and the new hire does what the job description implied: activity across all four areas at once.\n\nThat is how a business ends up with a busy marketer and flat revenue.\n\n## What to do instead\n\n**Buy the diagnosis first.** It is a project, not a job. A few weeks of someone experienced telling you which of the four is actually broken.\n\n**Then hire against the answer.** If the problem is visibility, hire or contract someone strong in local search. If it is reputation, that is a systems problem. The role becomes specific, the interview becomes answerable, and you can tell whether it worked.\n\n**Revisit it annually.** Fixing one failure moves you to the next.\n\n## The uncomfortable part\n\nSometimes the diagnosis reveals you do not need a hire at all — that eight hours a month of the right work would fix what is broken.\n\nThat is a good outcome that is easy to resent, because it is less satisfying than a decisive hire. But a smaller correct answer beats a larger wrong one, and you find that out for the price of a few weeks rather than a year of salary.",

      "slug": "first-ninety-days-marketing-what-to-expect",
      "title": "What to expect in the first ninety days, either way",
      "date": "2026-09-01",
      "status": "draft",
      "author": "Francis John",
      "excerpt": "Whether you hire or contract, the first ninety days should look about the same. Here is the timeline, so you can tell progress from motion.",
      "cover": "",
      "tags": [
        "Hiring",
        "Marketing Ops"
      ],
      "projectSlug": "revenueiq",
      "externalLabel": "Google Business Profile Help",
      "externalUrl": "https://support.google.com/business/answer/3038177",
      "body": "Most owners have no reference point for what marketing progress looks like early on. So they judge it by how busy the person seems, which is the one signal that means nothing.\n\nHere is what the first ninety days should actually produce.\n\n## Days one to thirty — find the leak\n\nNo campaigns yet. No posting schedule. The work is diagnosis.\n\n- Where does the business currently appear for the searches customers actually type?\n- Is the Google Business Profile complete, categorised properly, and covering the right service areas?\n- How many reviews, how recent, and what do they say?\n- Does the site have a page for each service, or one page listing all of them?\n- What happens to someone who visits and does not call?\n\n**By day thirty you should have a written answer to one question: which of visibility, trust, conversion or retention is losing you the most money.** If nobody can answer that, thirty days have gone.\n\n## Days thirty-one to sixty — fix the foundation\n\nUnglamorous work that produces little visible activity and most of the eventual result.\n\n- The Google Business Profile completed properly, with real service areas rather than a county.\n- Listings made consistent across the directories that matter.\n- Service pages built or rebuilt so each one answers a question people search for.\n- A review request that actually goes out after a job, rather than when someone remembers.\n\nLittle of this is visible from outside. Owners get nervous around day forty-five. That is normal, and the wrong moment to change direction.\n\n## Days sixty-one to ninety — the first signal\n\nNow something should move.\n\n- Movement in map pack visibility for your core service and town.\n- New reviews arriving on a rhythm instead of by accident.\n- Calls that mention finding you on Google.\n- A tracked number showing whether the phone is ringing more.\n\n**Ninety days is early for revenue and not early for signal.** If nothing has moved by day ninety, either the diagnosis was wrong or the work did not happen.\n\n## The question to ask at each stage\n\nNot *what did you do this month*. Ask **what changed, and how do you know**.\n\nSomeone doing this well has an answer ready. Someone filling time will describe activity. The difference is audible immediately, and it works the same on an employee or a contractor.",

        "keywords": "first 90 days marketing plan local business",

      "body": "There are three ways to buy marketing help, and each one fits a different shape of work. Choosing by price rather than by shape is how businesses end up paying for the wrong structure.\n\n## Project contract\n\n**Fits work with an end.** A site rebuild. A local search overhaul. Fixing the Google Business Profile properly, once.\n\nDefined scope, defined price, defined finish. You are buying an outcome rather than time.\n\n**Where it goes wrong:** treating ongoing work as a project. Local search is not a thing you complete. Rankings move because competitors move. A one-time fix decays quietly for six months and then someone notices.\n\n## Retainer\n\n**Fits steady work under about twenty hours a week.** Ongoing local search, review management, monthly content, the reporting that tells you whether any of it is working.\n\nYou get continuity — someone who knows the business without relearning it each time — without carrying a salary.\n\n**Where it goes wrong:** a retainer with no defined output becomes a subscription to reports. If you cannot say what the retainer is supposed to produce, that is the problem, not the price.\n\n## Employment\n\n**Fits thirty-plus consistent hours a week of genuinely useful work.**\n\nPast that threshold, an employee is cheaper per productive hour and better placed. They are in the meetings, they hear the complaints, they build knowledge that stays.\n\n**Where it goes wrong:** hiring at fifteen real hours and filling the rest with activity. The role fails slowly, and everyone blames the person.\n\n## Reading your own pattern\n\nTrack it for a month. Not what you wish it were — what it is.\n\n- **Bursts with quiet gaps** → project work.\n- **Steady but modest** → retainer.\n- **Steady and heavy** → hire.\n- **Unknown** → you are not ready to choose. Buy the diagnosis first.\n\n## The hybrid most local businesses land on\n\nOne person inside who owns the relationship, knows the customers, and keeps the knowledge in the buildi <script>
/* ============================================================
   0. Pristine source capture
   Grab the untouched document before anything renders, so
   "Publish" can hand back a clean file with new content baked in.
   ============================================================ */
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

/* ============================================================
   1. Store
   ============================================================ */
const SEED = JSON.parse(document.getElementById('seed').textContent);
const KEY = 'fj.site.v1';
const KEY_AUTH = 'fj.site.key';

/* ------------------------------------------------------------------
   Remote store — a Netlify Function backed by Netlify Blobs.
   Content saved here is live on every device, no redeploy needed.
   When the endpoint is missing (local file, preview, offline) the
   dashboard falls back to browser storage and says so.
   ------------------------------------------------------------------ */
const Remote = {
  url: '/api/content',
  key: null,
  state: 'unknown',        // unknown | online | offline
  lastError: '',

  loadKey(){
    try { this.key = sessionStorage.getItem(KEY_AUTH); } catch(e){}
    return this.key;
  },
  setKey(k){
    this.key = k;
    try { k ? sessionStorage.setItem(KEY_AUTH, k) : sessionStorage.removeItem(KEY_AUTH); } catch(e){}
  },

  async pull(){
    try {
      const r = await fetch(this.url, { cache:'no-store' });
      if (r.status === 204){ this.state = 'online'; return null; }
      if (!r.ok) throw new Error('status ' + r.status);
      const data = await r.json();
      this.state = 'online';
      return data;
    } catch(e){
      this.state = 'offline';
      this.lastError = e.message;
      return null;
    }
  },

  async verify(k){
    try {
      const r = await fetch(this.url + '?verify=1', {
        cache:'no-store', headers:{ 'x-edit-key': k }
      });
      this.state = 'online';
      const body = await r.json().catch(()=>({}));
      return { ok: r.ok && body.ok === true, reason: body.reason || (r.ok ? '' : 'rejected') };
    } catch(e){
      this.state = 'offline';
      return { ok:false, reason:'offline' };
    }
  },

  async push(data){
    if (!this.key) return { ok:false, reason:'nokey' };
    try {
      const r = await fetch(this.url, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json', 'x-edit-key': this.key },
        body: JSON.stringify(data)
      });
      if (r.status === 401){ this.state='online'; return { ok:false, reason:'auth' }; }
      if (!r.ok){ this.state='online'; return { ok:false, reason:'http ' + r.status }; }
      this.state = 'online';
      return { ok:true };
    } catch(e){
      this.state = 'offline';
      return { ok:false, reason:'offline' };
    }
  }
};

const Store = {
  data: null,
  dirty: false,
  memory: null,
  migrated: false,
  load(){
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch(e) { saved = this.memory; }
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        const savedV = (parsed.meta && parsed.meta.contentVersion) || 1;
        const seedV  = (SEED.meta && SEED.meta.contentVersion) || 1;
        /* A newer file has shipped with rewritten content. Browser-stored copy
           would otherwise silently replay the old version forever, so take the
           new content and set the old aside rather than discarding it. */
        /* A newer file has shipped. Do NOT wipe to the file's content — that
           would revert anything published or edited. Merge instead: keep the
           cached content as the base of truth, layer the file's new structure
           on top, and append only posts the cache has never seen. The proper
           reconcile against the live server happens moments later in
           syncFromServer; this just avoids destroying the cache in the meantime. */
        if (savedV < seedV){
          try { localStorage.setItem(KEY + '.prev', saved); } catch(e){ this.prevMemory = saved; }
          const base = merge(clone(SEED), parsed);          // cache content wins
          const cacheSlugs = new Set((parsed.posts||[]).map(p=>p.slug));
          const newPosts = (SEED.posts||[]).filter(p=>!cacheSlugs.has(p.slug));
          const seedBySlug = {}; (SEED.posts||[]).forEach(p=>{ seedBySlug[p.slug]=p; });
          const isBlank = v => v==null || v==='' || (Array.isArray(v)&&v.length===0);
          const filled = (parsed.posts||[]).map(lp=>{
            const fp = seedBySlug[lp.slug]; if(!fp) return lp;
            const mp = Object.assign({}, lp);
            ['cover','excerpt','externalUrl','externalLabel','projectSlug','cta','publishAt'].forEach(k=>{
              if(isBlank(mp[k]) && !isBlank(fp[k])) mp[k]=fp[k];
            });
            if(fp.status==='published' && mp.status!=='published'){
              mp.status='published'; if(isBlank(mp.date)&&!isBlank(fp.date))mp.date=fp.date; mp.baked=true; delete mp.publishAt;
            }
            return mp;
          });
          base.posts = filled.concat(newPosts); // back-filled live states, add new
          if (SEED.services && !parsed.services) base.services = SEED.services;
          // newer file's profile wording wins over a stale cached copy
          if (SEED.profile){
            base.profile = base.profile || {};
            ['pitch','summary','role','availability','company'].forEach(k=>{
              if (SEED.profile[k] != null) base.profile[k] = SEED.profile[k];
            });
          }
          base.meta = base.meta || {};
          base.meta.contentVersion = seedV;
          this.data = base;
          this.migrated = true;
          return;
        }
        this.data = merge(clone(SEED), parsed);
        return;
      } catch(e){ /* fall through to seed */ }
    }
    this.data = clone(SEED);
  },
  hasPrevious(){
    try { return !!localStorage.getItem(KEY + '.prev'); } catch(e){ return !!this.prevMemory; }
  },
  restorePrevious(){
    let prev = null;
    try { prev = localStorage.getItem(KEY + '.prev'); } catch(e){ prev = this.prevMemory; }
    if (!prev) return false;
    try {
      const parsed = JSON.parse(prev);
      if (parsed.meta) parsed.meta.contentVersion = (SEED.meta && SEED.meta.contentVersion) || 1;
      this.data = merge(clone(SEED), parsed);
      this.migrated = false;
      this.save();
      return true;
    } catch(e){ return false; }
  },
  save(){
    this.data._savedAt = Date.now();
    const json = JSON.stringify(this.data);
    try { localStorage.setItem(KEY, json); }
    catch(e) { this.memory = json; }
    this.dirty = false;
    Admin.paintStatus();
    /* push to the server so other devices see it; the local copy is
       already written, so a failure here costs nothing but a warning */
    if (Remote.key){
      this.syncing = true;
      Admin.paintStatus();
      Remote.push(this.data).then(res => {
        this.syncing = false;
        this.syncedAt = res.ok ? Date.now() : this.syncedAt;
        this.syncError = res.ok ? '' : res.reason;
        Admin.paintStatus();
        if (!res.ok && res.reason === 'auth') toast('Server rejected the passcode — saved locally only');
        else if (!res.ok) toast('Saved locally. Server sync failed: ' + res.reason);
      });
    }
    return true;
  },
  syncing: false,
  syncedAt: 0,
  syncError: '',
  touch(){ this.dirty = true; Admin.paintStatus(); },
  reset(){
    try { localStorage.removeItem(KEY); } catch(e){}
    this.memory = null;
    this.data = clone(SEED);
    this.dirty = false;
  },
  bytes(){ return new Blob([JSON.stringify(this.data)]).size; }
};

function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* SEED is whatever was baked into the deployed file, so anything that differs
   from it is an edit the public cannot see yet. This is what makes the
   "not live" warning accurate — and it clears itself once you redeploy. */
function diffAreas(){
  const a = Store.data, b = SEED, out = [];
  const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  if (!same(a.profile, b.profile)) out.push('Profile');
  if (!same(a.clusters, b.clusters) || !same(a.experience, b.experience) || !same(a.education, b.education)) out.push('Résumé');
  if (!same(a.projects, b.projects)) out.push('Systems');
  if (!same(a.posts, b.posts)) out.push('Journal');
  if (!same(a.copy, b.copy) || !same(a.proof, b.proof) || !same(a.serviceAreas, b.serviceAreas)) out.push('Page copy');
  if (!same(a.sidebar, b.sidebar)) out.push('Sidebar & CTAs');
  if (!same(a.meta, b.meta)) out.push('Settings');
  return out;
}
function postDiff(){
  const live = {}; (SEED.posts||[]).forEach(p => live[p.slug] = JSON.stringify(p));
  const now = {}; (Store.data.posts||[]).forEach(p => now[p.slug] = JSON.stringify(p));
  const added = [], changed = [], removed = [];
  Object.keys(now).forEach(k => { if (!(k in live)) added.push(k); else if (now[k] !== live[k]) changed.push(k); });
  Object.keys(live).forEach(k => { if (!(k in now)) removed.push(k); });
  return { added, changed, removed };
}
function merge(base, patch){
  if (Array.isArray(patch) || typeof patch !== 'object' || patch === null) return patch;
  const out = (typeof base === 'object' && base !== null && !Array.isArray(base)) ? base : {};
  for (const k in patch) out[k] = merge(out[k], patch[k]);
  return out;
}
function getPath(obj, path){
  return path.split('.').reduce((a,k)=> (a==null ? a : a[k]), obj);
}
function setPath(obj, path, val){
  const keys = path.split('.');
  const last = keys.pop();
  let cur = obj;
  for (const k of keys){ if (cur[k] == null) cur[k] = {}; cur = cur[k]; }
  cur[last] = val;
}

/* ============================================================
   2. Utilities
   ============================================================ */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const attr = s => esc(s);

function slugify(s){
  return String(s||'').toLowerCase().trim()
    .replace(/['’]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,70);
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US',{ year:'numeric', month:'long', day:'numeric' });
}
function words(s){ return String(s||'').trim().split(/\s+/).filter(Boolean).length; }
function readTime(s){ return Math.max(1, Math.round(words(s)/210)); }
function stripMd(s){
  return String(s||'').replace(/[#>*`_\-]/g,' ').replace(/\[(.*?)\]\(.*?\)/g,'$1').replace(/\s+/g,' ').trim();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2600);
}
function download(name, text, type){
  const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* --- markdown-lite --------------------------------------- */
function md(src){
  const lines = String(src||'').replace(/\r\n/g,'\n').split('\n');
  let out = '', list = null;
  const closeList = () => { if (list){ out += '</'+list+'>'; list = null; } };
  const inline = t => esc(t)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,a,u)=> '<img src="'+attr(u)+'" alt="'+attr(a)+'">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,a,u)=>{
      const ext = /^https?:\/\//.test(u) && !u.includes(location.hostname);
      return '<a href="'+attr(u)+'"'+(ext?' target="_blank" rel="noopener"':' data-link')+'>'+a+'</a>';
    })
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');

  for (let raw of lines){
    const line = raw.trimEnd();
    if (!line.trim()){ closeList(); continue; }
    let m;
    if ((m = line.match(/^(#{2,4})\s+(.*)$/))){
      closeList();
      const lvl = Math.min(m[1].length, 4);
      out += '<h'+lvl+'>'+inline(m[2])+'</h'+lvl+'>';
    } else if (/^(---|\*\*\*)$/.test(line.trim())){
      closeList(); out += '<hr>';
    } else if ((m = line.match(/^>\s?(.*)$/))){
      closeList(); out += '<blockquote>'+inline(m[1])+'</blockquote>';
    } else if ((m = line.match(/^[-*]\s+(.*)$/))){
      if (list !== 'ul'){ closeList(); out += '<ul>'; list = 'ul'; }
      out += '<li>'+inline(m[1])+'</li>';
    } else if ((m = line.match(/^\d+[.)]\s+(.*)$/))){
      if (list !== 'ol'){ closeList(); out += '<ol>'; list = 'ol'; }
      out += '<li>'+inline(m[1])+'</li>';
    } else {
      closeList(); out += '<p>'+inline(line)+'</p>';
    }
  }
  closeList();
  return out;
}

const Head = {

    const m = Store.data.meta;
    const base = (m.domain||'').replace(/\/$/,'');
    document.title = o.title;
    this.meta('name','description', o.description || m.defaultDescription);
    this.meta('name','robots', o.noindex ? 'noindex,nofollow' : 'index,follow,max-image-preview:large');
    this.link('canonical', base + (o.path === '/' ? '/' : o.path));
    this.meta('property','og:type', o.type || 'website');
    this.meta('property','og:title', o.title);
    this.meta('property','og:description', o.description || m.defaultDescription);
    this.meta('property','og:url', base + o.path);
    this.meta('property','og:site_name', m.siteName);
    this.meta('property','og:image', o.image || m.ogImage || '');
    this.meta('name','twitter:card', (o.image||m.ogImage) ? 'summary_large_image' : 'summary');
    if (m.twitter) this.meta('name','twitter:site', m.twitter);
    this.jsonld(o.schema);
  },
  meta(kind, key, val){
    let el = document.head.querySelector('meta['+kind+'="'+key+'"]');
    if (!val){ if (el) el.remove(); return; }
    if (!el){ el = document.createElement('meta'); el.setAttribute(kind, key); document.head.appendChild(el); }
    el.setAttribute('content', val);
  },
  link(rel, href){
    let el = document.head.querySelector('link[rel="'+rel+'"]');
    if (!el){ el = document.createElement('link'); el.rel = rel; document.head.appendChild(el); }
    el.href = href;
  },
  jsonld(obj){
    let el = document.getElementById('ld');
    if (!obj){ if (el) el.remove(); return; }
    if (!el){ el = document.createElement('script'); el.type = 'application/ld+json'; el.id = 'ld'; document.head.appendChild(el); }
    el.textContent = JSON.stringify(obj, null, 2);
  }
};

const ROUTES = ['systems','services','work','journal','contact','admin'];

/* Clean paths when the site sits at a domain root; hash routing when it
   does not — a preview frame, a file opened from disk, a sub-folder. */
let usePush = (function(){
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
  const seg = location.pathname.split('/').filter(Boolean);
  if (seg.length && ROUTES.indexOf(seg[0]) === -1) return false;
  try { history.replaceState(history.state, '', location.href); return true; }
  catch(e){ return false; }
})();

function currentPath(){
  if (!usePush) return (location.hash.replace(/^#/,'') || '/');
  return location.pathname.replace(/\/+$/,'') || '/';
}
function navigate(path, replace){
  if (usePush){
    try {
      history[replace ? 'replaceState' : 'pushState']({}, '', path);
    } catch(e){
      usePush = false;
      location.hash = '#' + path;
    }
  } else {
    if (replace) location.replace('#'+path); else location.hash = '#'+path;
  }
  /* ---------- kinetic homepage engine ---------- */
function initHomepage(){
  const root = document.getElementById('revhome');
  if (!root) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // hero idle counter
  const heroCount = document.getElementById('hpHeroCount');
  if (heroCount){
    if (initHomepage._t) clearInterval(initHomepage._t);
    let base = 0;
    heroCount.textContent = '$0';
    initHomepage._t = setInterval(()=>{ base += Math.floor(Math.random()*400)+120; heroCount.textContent = '$'+base.toLocaleString(); }, 900);
  }

  // reveal on scroll
  const rvs = root.querySelectorAll('.rv');
  if (reduce){ rvs.forEach(el=>el.classList.add('in')); }
  else {
    const io = new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.16});
    rvs.forEach(el=>io.observe(el));
  }

  // engine — light the stages in sequence, run the output, then keep idling
  const stages = [...root.querySelectorAll('.eng-stage')];
  const output = document.getElementById('hpOutput');
  const revCount = document.getElementById('hpRevCount');
  let fired = false;
  function easeOut(t){ return 1-Math.pow(1-t,3); }
  function countTo(el,target,dur){
    if(!el) return;
    const t0 = performance.now();
    (function tick(now){ const p=Math.min((now-t0)/dur,1); el.textContent='$'+Math.floor(easeOut(p)*target).toLocaleString(); if(p<1) requestAnimationFrame(tick); })(t0);
  }
  function fire(){
    if(fired) return; fired = true;
    if (reduce){ stages.forEach(s=>s.classList.add('hot')); if(output)output.classList.add('run'); if(revCount)revCount.textContent='$84,000'; return; }
    stages.forEach((s,i)=>setTimeout(()=>s.classList.add('hot'), i*300));
    setTimeout(()=>{ if(output)output.classList.add('run'); countTo(revCount,84000,1700); }, stages.length*300+150);
  }
  const engBox = document.getElementById('hpEngine2');
  if (engBox){
    if (reduce) fire();
    else {
      const eio = new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting) fire();})},{threshold:.35});
      eio.observe(engBox);
    }
  }

  // ignition sequence — light the steps one by one when scrolled in
  const ignSeq = document.getElementById('ignSeq');
  if (ignSeq){
    const steps = [...ignSeq.querySelectorAll('.ign-step')];
    let ignFired = false;
    const lightUp = ()=>{
      if (ignFired) return; ignFired = true;
      if (reduce){ steps.forEach(s=>s.classList.add('lit')); return; }
      ignSeq.classList.add('run');
      steps.forEach((s,i)=>setTimeout(()=>s.classList.add('lit'), 300 + i*560));
    };
    if (reduce) lightUp();
    else { const iio=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting)lightUp();})},{threshold:.4}); iio.observe(ignSeq); }
  }
}

render();

   Sidebar — the sticky right rail on Journal and article pages.
   All copy is dashboard-editable (Store.data.sidebar).
   ============================================================ */

/* Which CTA belongs on a given article. Resolves automatically from the
   post's own fields, so most articles get the right one with no extra work:
     1. an explicit per-article override (post.cta) if set
     2. a per-niche external link if the post has one (dental, home watch…)
     3. the CTA mapped to the post's system (projectSlug)
     4. the default diagnostic offer
   A dashboard field can override any of it per article. */
function ctaForPost(po){
  const sb = Store.data.sidebar || {};
  // 1. explicit override on the post
  if (po && po.cta && (po.cta.title || po.cta.btn)){
    return Object.assign({ kicker:'Related', accent:'brass' }, po.cta);
  }
  // 2. a niche article that links out to its own landing page
  if (po && po.externalUrl && /holisticdental|homewatch/i.test(po.externalUrl)){
    const isDental = /holisticdental/i.test(po.externalUrl);
    return {
      kicker: isDental ? 'For this practice' : 'For your business',
      title: isDental ? 'Get found by the patients already searching.' : 'Get found by the homeowners already searching.',
      text: isDental
        ? 'I build local visibility for biological and holistic practices specifically. See exactly how.'
        : 'I build local visibility for home watch companies specifically. See exactly how.',
      btn: isDental ? 'Holistic dental marketing' : 'Home watch marketing',
      href: po.externalUrl, external:true, accent:'clay'
    };
  }
  // 3. mapped to the post's system — but Hiring/Marketing-Ops pieces are about
  //    the decision the diagnostic answers, so those keep the default offer
  const tags = (po && po.tags) || [];
  const isHiringTopic = tags.indexOf('Hiring') !== -1;
  const map = sb.ctaByProject || {};
  if (!isHiringTopic && po && po.projectSlug && map[po.projectSlug]){
    return Object.assign({ accent:'sea' }, map[po.projectSlug]);
  }
  // 4. default diagnostic offer
  return {
    kicker: sb.offerKicker || 'Start here',
    title: sb.offerTitle || 'Not sure what your business needs?',
    text: sb.offerText || '',
    btn: sb.offerBtn || 'See the diagnostic',
    href: sb.offerHref || '/services', accent:'brass'
  };
}

/* Related posts — other published articles that share a tag with this one,
   nearest first (most shared tags), so every article links onward to siblings.
   Builds the internal link web automatically as posts are added. */
function relatedPosts(po, limit){
  limit = limit || 3;
  const pub = publishedPosts();
  const bySlug = {}; pub.forEach(p => bySlug[p.slug] = p);
  const have = new Set([po.slug]);
  const out = [];

  // 1. explicit cluster links first — relatedSlugs, in order (pillar, siblings, foundation)
  (po.relatedSlugs || []).forEach(sl => {
    if (out.length < limit && bySlug[sl] && !have.has(sl)){ out.push(bySlug[sl]); have.add(sl); }
  });

  // 2. any article whose pillarRef points at THIS post (so a pillar surfaces its cluster)
  if (out.length < limit){
    pub.forEach(p => {
      if (out.length < limit && !have.has(p.slug) && p.pillarRef === po.slug){ out.push(p); have.add(p.slug); }
    });
  }

  // 3. fall back to tag/project scoring to fill any remaining slots
  if (out.length < limit){
    const mine = new Set((po.tags||[]));
    const scored = pub
      .filter(p => !have.has(p.slug))
      .map(p => {
        const shared = (p.tags||[]).filter(t => mine.has(t)).length;
        const sameProject = p.projectSlug && p.projectSlug === po.projectSlug ? 1 : 0;
        return { p, score: shared*2 + sameProject };
      })
      .filter(x => x.score > 0)
      .sort((a,b) => b.score - a.score || (b.p.date||'').localeCompare(a.p.date||''));
    scored.forEach(x => { if (out.length < limit && !have.has(x.p.slug)){ out.push(x.p); have.add(x.p.slug); } });
  }

  // 4. last resort — most recent, so the block is never thin
  if (out.length < limit){
    pub.forEach(p => { if (out.length < limit && !have.has(p.slug)){ out.push(p); have.add(p.slug); } });
  }
  return out;
}

const HUES = ['sea','brass','clay','moss'];
/* Colours are assigned from the full set of tags in use, sorted, so the three
   spread evenly and a given tag always looks the same across the site. */
function tagHueMap(){
  const seen = [];
  Store.data.posts.forEach(p => (p.tags||[]).forEach(t => { if (seen.indexOf(t) === -1) seen.push(t); }));
  seen.sort();
  const map = {};
  seen.forEach((t, i) => { map[t] = HUES[i % HUES.length]; });
  return map;
}
function hueFor(str, i){
  if (!str) return HUES[(i||0) % HUES.length];
  const map = tagHueMap();
  if (map[str]) return map[str];
  let h = 0;
  for (let k = 0; k < str.length; k++) h = (h * 131 + str.charCodeAt(k) * 7) | 0;
  return HUES[Math.abs(h) % HUES.length];
}

    + '<textarea data-bind="'+path+'" rows="'+(rows||4)+'"'+(live?' data-live':'')+(rows>12?' class="tall"':'')+'>'+esc(val)+'</textarea>'

function syncLabel(){
  if (Store.syncing) return 'Syncing…';

  if (Remote.state === 'online' && Remote.key) return Store.syncError ? 'Sync failed' : 'Live on all devices';
  if (Remote.state === 'online') return 'Server connected';
  return 'Checking…';
}

/* up / down controls for any array item */
function mv(path, i, len){
  const b = (dir, glyph, label, on) =>
    '<button class="btn btn-ghost btn-sm mv" data-act="move:'+path+'.'+i+'|'+dir+'"'
    + (on ? '' : ' disabled') + ' title="'+label+'" aria-label="'+label+'">'+glyph+'</button>';
  return '<span class="mv-group">' + b('up','↑','Move up', i > 0) + b('down','↓','Move down', i < len-1) + '</span>';
}

/* --- SEO analysis ----------------------------------------- */
function analyze(po){
  const kw = ((po.seo&&po.seo.keywords)||'').toLowerCase().trim();
  const title = ((po.seo&&po.seo.title)||po.title||'');
  const desc = ((po.seo&&po.seo.description)||po.excerpt||'');
  const body = stripMd(po.body||'');
  const wc = words(body);
  const heads = (String(po.body||'').match(/^#{2,4}\s+/gm)||[]).length;
  const c = [];
  const add = (state,text)=> c.push({state,text});

  if (!kw) add('fail','Set a focus keyword — the phrase someone would actually type.');
  else {
    add('pass','Focus keyword set: “'+kw+'”');
    add(title.toLowerCase().includes(kw)?'pass':'warn', title.toLowerCase().includes(kw)?'Keyword appears in the title.':'Keyword is missing from the title.');
    add((po.slug||'').includes(slugify(kw))?'pass':'warn',(po.slug||'').includes(slugify(kw))?'Keyword appears in the URL.':'Keyword is missing from the URL slug.');
    add(desc.toLowerCase().includes(kw)?'pass':'warn', desc.toLowerCase().includes(kw)?'Keyword appears in the description.':'Keyword is missing from the description.');
    add(body.toLowerCase().slice(0,400).includes(kw)?'pass':'warn', body.toLowerCase().slice(0,400).includes(kw)?'Keyword appears in the opening.':'Keyword does not appear in the first paragraphs.');
  }
  add(title.length>=30&&title.length<=60?'pass':'warn','Title is '+title.length+' characters (aim for 30–60).');
  add(desc.length>=120&&desc.length<=158?'pass':(desc?'warn':'fail'),'Description is '+desc.length+' characters (aim for 120–158).');
  add(wc>=300?'pass':(wc>=150?'warn':'fail'), wc+' words in the body (300+ holds up better).');
  add(heads>=2?'pass':'warn', heads+' subheading'+(heads===1?'':'s')+' (two or more helps people skim).');
  add(po.projectSlug?'pass':'fail', po.projectSlug?'Links back to a project page.':'Not linked to a project — the internal link is missing.');
  add(po.externalUrl?'pass':'warn', po.externalUrl?'Links out to an external source.':'No external source cited.');
  add((po.tags||[]).length?'pass':'warn',(po.tags||[]).length?'Tagged.':'No tags set.');
  add(po.cover?'pass':'warn', po.cover?'Cover image set.':'No cover image — links will share without a picture.');
  add(po.excerpt?'pass':'fail', po.excerpt?'Excerpt written.':'No excerpt — the journal list will look empty.');

  const passes = c.filter(x=>x.state==='pass').length;
  return { score: Math.round(passes / c.length * 100), checks: c };
}
